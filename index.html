<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/lumina_logo.svg" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Primary Meta Tags -->
    <title>Lumina AI — Build, learn, and master the art of Generative AI.</title>
    <meta name="title" content="Lumina AI — Build, learn, and master the art of Generative AI." />
    <meta name="description" content="Build, learn, and master the art of Generative AI. Explore the 7-layer engineering stack, interactive tensor simulators, retrieval architectures, autonomous agent swarms, and enterprise FinOps." />
    <meta name="keywords" content="Lumina AI, Generative AI, RAG, Retrieval Augmented Generation, AI Engineering, LLM, Vector Database, Hybrid Search, Multi-Agent Systems, Context Engineering, Memory Systems, LangGraph, Claude, AgentOps" />
    <meta name="author" content="Nagaraj Y" />
    <meta name="copyright" content="© 2025–2026 Nagaraj Y" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumina AI — Build, learn, and master the art of Generative AI." />
    <meta property="og:description" content="Build, learn, and master the art of Generative AI. Interactive laboratory and comprehensive curriculum covering production AI systems." />
    <meta property="og:image" content="/assets/lumina_logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Lumina AI — Build, learn, and master the art of Generative AI." />
    <meta property="twitter:description" content="Build, learn, and master the art of Generative AI. Interactive laboratory and comprehensive curriculum covering production AI systems." />
    <meta property="twitter:image" content="/assets/lumina_logo.svg" />

    <!-- Base Styling to Prevent FOUC -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      .bottom-nav {
        padding-bottom: env(safe-area-inset-bottom);
      }
      html, body {
        margin: 0;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        background-color: #F7F8FA;
        color: #1A1D26;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        height: 100vh;
        overflow: hidden;
      }

      /* Custom Scrollbar — Clean, minimal */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #D1D5DB transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
