<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <linearGradient id="mapbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
  <linearGradient id="mapblue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mappurp" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect width="1200" height="500" fill="url(#mapbg)" rx="12"/>
<text x="40" y="46" fill="#fff" font-size="24" font-weight="800">Multi-agent topologies — one boss, or everyone equal</text>
<text x="40" y="70" fill="#94a3b8" font-size="13">Hierarchy buys clear ownership and cheap debugging. Peer networks buy fault tolerance and emergent coverage.</text>

<rect x="40" y="94" width="540" height="376" rx="12" fill="#0b1220" stroke="#1e293b" stroke-dasharray="4 4"/>
<text x="60" y="122" fill="#38bdf8" font-size="13" font-weight="800">HIERARCHICAL STRUCTURE</text>
<text x="60" y="142" fill="#94a3b8" font-size="11" font-weight="400">centralised decisions · specialised roles · easy to audit</text>

<rect x="210" y="164" width="200" height="66" rx="10" fill="url(#mapblue)"/>
<text x="310" y="192" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">Manager</text>
<text x="310" y="212" fill="#e0f2fe" font-size="10" font-weight="400" text-anchor="middle">plan · delegate · synthesise</text>

<g font-size="11" font-weight="700">
  <rect x="70" y="316" width="110" height="54" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="125" y="340" fill="#e2e8f0" text-anchor="middle">Research</text><text x="125" y="357" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">gather sources</text>
  <rect x="196" y="316" width="110" height="54" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="251" y="340" fill="#e2e8f0" text-anchor="middle">Analysis</text><text x="251" y="357" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">compute findings</text>
  <rect x="322" y="316" width="110" height="54" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="377" y="340" fill="#e2e8f0" text-anchor="middle">Writing</text><text x="377" y="357" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">draft output</text>
  <rect x="448" y="316" width="110" height="54" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text x="503" y="340" fill="#e2e8f0" text-anchor="middle">Review</text><text x="503" y="357" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">check quality</text>
</g>
<path d="M310,232 L310,260 L125,260 L125,312" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M310,232 L310,260 L251,260 L251,312" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M310,232 L310,260 L377,260 L377,312" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
<path d="M310,232 L310,260 L503,260 L503,312" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
<text x="60" y="400" fill="#94a3b8" font-size="11" font-weight="400">Trade-off: the manager is a bottleneck and a single point of failure.</text>

<rect x="620" y="94" width="540" height="376" rx="12" fill="#0b1220" stroke="#1e293b" stroke-dasharray="4 4"/>
<text x="640" y="122" fill="#a78bfa" font-size="13" font-weight="800">PEER-TO-PEER NETWORK</text>
<text x="640" y="142" fill="#94a3b8" font-size="11" font-weight="400">shared message bus · consensus · self-organising</text>

<ellipse cx="890" cy="272" rx="70" ry="34" fill="url(#mappurp)"/>
<text x="890" y="270" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">Message bus</text>
<text x="890" y="286" fill="#ede9fe" font-size="9" font-weight="400" text-anchor="middle">broadcast / listen</text>

<g font-size="11" font-weight="700">
  <rect x="835" y="176" width="110" height="42" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="890" y="202" fill="#e2e8f0" text-anchor="middle">Agent A</text>
  <rect x="1000" y="238" width="110" height="42" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="1055" y="264" fill="#e2e8f0" text-anchor="middle">Agent B</text>
  <rect x="950" y="340" width="110" height="42" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="1005" y="366" fill="#e2e8f0" text-anchor="middle">Agent C</text>
  <rect x="720" y="340" width="110" height="42" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="775" y="366" fill="#e2e8f0" text-anchor="middle">Agent D</text>
  <rect x="670" y="238" width="110" height="42" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="725" y="264" fill="#e2e8f0" text-anchor="middle">Agent E</text>
</g>
<path d="M890,218 L890,238" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
<path d="M1000,259 L962,268" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
<path d="M950,340 L920,306" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
<path d="M830,340 L860,306" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
<path d="M780,259 L818,266" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
<text x="640" y="400" fill="#94a3b8" font-size="11" font-weight="400">Trade-off: convergence and duplicate work need quorum rules and dedupe.</text>
</svg>
