<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Syne, sans-serif">
<defs><linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient><marker id="5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#A78BFA"/></marker></defs>
<rect width="1000" height="360" fill="url(#lbg)"/>
<text x="500" y="40" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="middle">Agentic RAG — Reason, Retrieve, Repeat</text>
<rect x="120" y="140" width="200" height="70" rx="10" fill="#1a1a2e" stroke="#E8C558" stroke-width="2"/>
<text x="220" y="175" font-family="Syne, sans-serif" font-weight="800" fill="#E8C558" text-anchor="middle">🤖 Think</text>
<line x1="320" y1="175" x2="420" y2="175" stroke="#C96A5A" stroke-width="2.5" marker-end="url(#ah6)"/>
<rect x="420" y="140" width="200" height="70" rx="10" fill="#C96A5A21" stroke="#C96A5A" stroke-width="2"/>
<text x="520" y="175" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="middle">🔍 Search</text>
<line x1="620" y1="175" x2="720" y2="175" stroke="#C96A5A" stroke-width="2.5" marker-end="url(#ah6)"/>
<rect x="720" y="140" width="200" height="70" rx="10" fill="#0f172a" stroke="#C96A5A" stroke-width="2"/>
<text x="820" y="175" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="middle">✅ Answer?</text>
<line x1="820" y1="140" x2="820" y2="90" stroke="#A78BFA" stroke-width="2.5"/>
<rect x="720" y="40" width="200" height="60" rx="10" fill="#A78BFA21" stroke="#A78BFA" stroke-width="2"/>
<text x="820" y="72" font-family="Syne, sans-serif" font-weight="800" fill="#A78BFA" text-anchor="middle">refine query → loop</text>
<line x1="720" y1="70" x2="620" y2="140" stroke="#A78BFA" stroke-width="2" marker-end="url(#5)"/>
<defs><marker id="ah6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C96A5A"/></marker></defs>
<text x="500" y="300" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">The LLM decides how many retrieval rounds — reformulating the query until it can answer confidently.</text>
<text x="500" y="325" font-family="Syne, sans-serif" font-weight="700" fill="#A78BFA" text-anchor="middle">Cap iterations to avoid runaway loops.</text>
</svg>