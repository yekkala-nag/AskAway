<text x="1075.0" y="225" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">step 7</text>
<text x="600" y="265" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">Each stage filters noise: hybrid fuses dense+sparse, rerank keeps top-5, compress trims tokens before the LLM.</text>
</svg>