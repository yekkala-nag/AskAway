<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <linearGradient id="ipbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
  <linearGradient id="ipteal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#5EC4C8"/></linearGradient>
  <marker id="iparr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#5EC4C8"/></marker>
</defs>
<rect width="1200" height="420" fill="url(#ipbg)" rx="12"/>
<text x="40" y="46" fill="#fff" font-size="24" font-weight="800">The ingestion spine — everything downstream inherits its mistakes</text>
<text x="40" y="70" fill="#94a3b8" font-size="13">Load → parse → chunk → embed → serve. Fail at parse and no retriever can rescue the answer.</text>

<g font-size="12" font-weight="700">
  <rect x="40" y="104" width="200" height="112" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
  <text x="58" y="132" fill="#5EC4C8">1 · Load</text>
  <text x="58" y="156" fill="#e2e8f0" font-weight="400">PDF · DOCX · TXT</text>
  <text x="58" y="178" fill="#e2e8f0" font-weight="400">one loader per ext</text>
  <text x="58" y="200" fill="#94a3b8" font-weight="400">page objects</text>

  <rect x="270" y="104" width="200" height="112" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
  <text x="288" y="132" fill="#5EC4C8">2 · Parse</text>
  <text x="288" y="156" fill="#e2e8f0" font-weight="400">text + metadata</text>
  <text x="288" y="178" fill="#e2e8f0" font-weight="400">source attribution</text>
  <text x="288" y="200" fill="#94a3b8" font-weight="400">layout is lost here</text>

  <rect x="500" y="104" width="200" height="112" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
  <text x="518" y="132" fill="#5EC4C8">3 · Chunk</text>
  <text x="518" y="156" fill="#e2e8f0" font-weight="400">500 chars / 80 overlap</text>
  <text x="518" y="178" fill="#e2e8f0" font-weight="400">recursive split</text>
  <text x="518" y="200" fill="#94a3b8" font-weight="400">decides what is findable</text>

  <rect x="730" y="104" width="200" height="112" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
  <text x="748" y="132" fill="#5EC4C8">4 · Embed</text>
  <text x="748" y="156" fill="#e2e8f0" font-weight="400">MiniLM · 384-d</text>
  <text x="748" y="178" fill="#e2e8f0" font-weight="400">FAISS or Chroma</text>
  <text x="748" y="200" fill="#94a3b8" font-weight="400">vector + payload</text>

  <rect x="960" y="104" width="200" height="112" rx="10" fill="url(#ipteal)"/>
  <text x="978" y="132" fill="#04121a">5 · Serve</text>
  <text x="978" y="156" fill="#04121a" font-weight="400">FastAPI + stream</text>
  <text x="978" y="178" fill="#04121a" font-weight="400">cache · rate limit</text>
  <text x="978" y="200" fill="#0b2a33" font-weight="400">retrieve then answer</text>
</g>

<path d="M240,160 L266,160" stroke="#5EC4C8" stroke-width="2" marker-end="url(#iparr)"/>
<path d="M470,160 L496,160" stroke="#5EC4C8" stroke-width="2" marker-end="url(#iparr)"/>
<path d="M700,160 L726,160" stroke="#5EC4C8" stroke-width="2" marker-end="url(#iparr)"/>
<path d="M930,160 L956,160" stroke="#5EC4C8" stroke-width="2" marker-end="url(#iparr)"/>

<rect x="40" y="252" width="1120" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="278" fill="#fff" font-size="12" font-weight="700">Cheapest upgrade order: parser → chunk strategy → embedding model → answer model.</text>
<text x="60" y="300" fill="#94a3b8" font-size="11" font-weight="400">A better LLM cannot recover a claim the chunker cut in half or the parser dropped entirely.</text>

<rect x="40" y="332" width="1120" height="58" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="1.5"/>
<text x="60" y="356" fill="#5EC4C8" font-size="12" font-weight="700">Project 2 runs this spine as a service: streaming tokens out, prompt-hash cache in front, per-IP window as the brake.</text>
<text x="60" y="377" fill="#94a3b8" font-size="11" font-weight="400">Cache hit rate is the metric that matters — the same question asked twice should cost nothing.</text>
</svg>
