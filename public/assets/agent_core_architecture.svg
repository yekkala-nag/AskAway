<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <linearGradient id="acbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
  <linearGradient id="acblue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <marker id="acarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker>
  <marker id="acarrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#10b981"/></marker>
  <marker id="acarrp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#a78bfa"/></marker>
</defs>
<rect width="1200" height="520" fill="url(#acbg)" rx="12"/>
<text x="40" y="46" fill="#fff" font-size="24" font-weight="800">Core agent architecture — brain, memory, tools over a perceive-reason-act loop</text>
<text x="40" y="70" fill="#94a3b8" font-size="13">The LLM decides, memory supplies context, tools change the world. Layers turn input into verified action.</text>

<g font-size="12" font-weight="700">
  <rect x="60" y="100" width="300" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="130" fill="#38bdf8">🧠 AI Brain (LLM)</text>
  <text x="80" y="154" fill="#e2e8f0" font-weight="400">model selection · temperature</text>
  <text x="80" y="176" fill="#e2e8f0" font-weight="400">goal decomposition</text>
  <text x="80" y="198" fill="#94a3b8" font-weight="400">decides the next action</text>

  <rect x="450" y="100" width="300" height="120" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="470" y="130" fill="#a78bfa">🗄️ Memory</text>
  <text x="470" y="154" fill="#e2e8f0" font-weight="400">working · episodic · semantic</text>
  <text x="470" y="176" fill="#e2e8f0" font-weight="400">conversation window (k)</text>
  <text x="470" y="198" fill="#94a3b8" font-weight="400">context survives turns</text>

  <rect x="840" y="100" width="300" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="860" y="130" fill="#34d399">🔧 Tools</text>
  <text x="860" y="154" fill="#e2e8f0" font-weight="400">APIs · search · code · files</text>
  <text x="860" y="176" fill="#e2e8f0" font-weight="400">typed schemas + permissions</text>
  <text x="860" y="198" fill="#94a3b8" font-weight="400">how the agent acts</text>

  <rect x="450" y="262" width="300" height="76" rx="10" fill="url(#acblue)"/>
  <text x="600" y="292" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">AI Agent (control loop)</text>
  <text x="600" y="315" fill="#e0f2fe" font-size="11" font-weight="400" text-anchor="middle">think → act → observe, bounded by step caps</text>
</g>

<path d="M210,222 L210,300 L446,300" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#acarr)"/>
<path d="M990,222 L990,300 L754,300" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#acarrg)"/>
<path d="M600,222 L600,258" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#acarrp)"/>
<path d="M600,262 L600,226" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#acarrp)"/>

<g font-size="12" font-weight="700">
  <text x="40" y="392" fill="#94a3b8" font-size="11">PIPELINE</text>
  <rect x="60" y="404" width="330" height="80" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="80" y="430" fill="#38bdf8">1 · Perception</text>
  <text x="80" y="452" fill="#e2e8f0" font-weight="400">text, images, APIs, sensors</text>
  <text x="80" y="472" fill="#94a3b8" font-weight="400">normalise the current state</text>

  <rect x="435" y="404" width="330" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="455" y="430" fill="#f59e0b">2 · Reasoning engine</text>
  <text x="455" y="452" fill="#e2e8f0" font-weight="400">plans under constraints</text>
  <text x="455" y="472" fill="#94a3b8" font-weight="400">picks tools, checks policy</text>

  <rect x="810" y="404" width="330" height="80" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="830" y="430" fill="#34d399">3 · Action interface</text>
  <text x="830" y="452" fill="#e2e8f0" font-weight="400">tool calls, APIs, responses</text>
  <text x="830" y="472" fill="#94a3b8" font-weight="400">results feed the next observe</text>
</g>
<path d="M390,444 L431,444" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#acarr)"/>
<path d="M765,444 L806,444" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#acarr)"/>
</svg>
