<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="Syne, sans-serif">
<defs><linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs>
<rect width="1100" height="360" fill="url(#lbg)"/>
<text x="550" y="40" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="middle">Multi-Head Latent Attention — Compress the KV Cache</text>
<rect x="60" y="90" width="220" height="80" rx="10" fill="#0f172a" stroke="#C96A5A" stroke-width="2"/>
<text x="170" y="125" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="middle">Standard MHA</text>
<text x="170" y="150" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">cache K,V per head</text>
<text x="170" y="170" font-family="Syne, sans-serif" font-weight="700" fill="#C96A5A" text-anchor="middle">O(n·h·d)  ❌ big</text>
<line x1="170" y1="170" x2="170" y2="230" stroke="#5EC4C8" stroke-width="2.5"/>
<text x="170" y="215" font-family="Syne, sans-serif" font-weight="600" fill="#5EC4C8" text-anchor="middle">compress ↓</text>
<rect x="70" y="235" width="200" height="60" rx="10" fill="#5EC4C821" stroke="#5EC4C8" stroke-width="2"/>
<text x="170" y="265" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="middle">Latent C_KV</text>
<text x="170" y="285" font-family="Syne, sans-serif" font-weight="700" fill="#5EC4C8" text-anchor="middle">d_c ≪ d  ✅ tiny</text>
<line x1="270" y1="265" x2="470" y2="265" stroke="#5EC4C8" stroke-width="2.5" marker-end="url(#ah2)"/>
<rect x="470" y="235" width="220" height="60" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
<text x="580" y="265" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="middle">Up-project → K,V</text>
<text x="580" y="285" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">C_KV · W_UK, W_UV</text>
<defs><marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5EC4C8"/></marker></defs>
<text x="550" y="330" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">Cache a small latent once; recompute K &amp; V on demand → 2.7–4.7× less memory, zero quality loss.</text>
</svg>