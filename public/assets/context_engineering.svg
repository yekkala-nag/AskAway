<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Syne, sans-serif">
<defs><linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs>
<rect width="1000" height="360" fill="url(#lbg)"/>
<text x="500" y="40" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="middle">Context Engineering — 4 Strategies (LangChain)</text>
<rect x="60" y="90" width="430" height="110" rx="12" fill="#E8C55821" stroke="#E8C558" stroke-width="2"/>
<text x="84" y="134" font-family="Syne, sans-serif" font-weight="800" fill="#E8C558" text-anchor="start">✍️ WRITE</text>
<text x="84" y="168" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="start">cache static prompt prefixes</text>
<rect x="510" y="90" width="430" height="110" rx="12" fill="#5EC4C821" stroke="#5EC4C8" stroke-width="2"/>
<text x="534" y="134" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="start">🎯 SELECT</text>
<text x="534" y="168" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="start">retrieve only relevant fragments</text>
<rect x="60" y="220" width="430" height="110" rx="12" fill="#C96A5A21" stroke="#C96A5A" stroke-width="2"/>
<text x="84" y="264" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="start">✂️ COMPRESS</text>
<text x="84" y="298" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="start">strip noise, compact window</text>
<rect x="510" y="220" width="430" height="110" rx="12" fill="#A78BFA21" stroke="#A78BFA" stroke-width="2"/>
<text x="534" y="264" font-family="Syne, sans-serif" font-weight="800" fill="#A78BFA" text-anchor="start">🛡️ ISOLATE</text>
<text x="534" y="298" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="start">separate sub-agent memory</text>
<text x="500" y="330" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">Curate what enters &amp; exits the finite context window between turns — the heart of reliable RAG.</text>
</svg>