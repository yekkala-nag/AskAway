<svg font-family="Syne, sans-serif" viewBox="0 0 1200 520"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#090d16"/></linearGradient><marker id="b" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#a78bfa" d="m0 0 8 3-8 3Z"/></marker></defs><path fill="url(#a)" d="M0 0h1200v520H0z"/><text x="600" y="42" fill="#f1f5f9" font-weight="800" text-anchor="middle">Modern AI Systems — Five Interlocking Layers</text><text x="600" y="68" fill="#94a3b8" font-weight="600" text-anchor="middle">A single LLM call, wrapped by RAG · Context · Loop · Agents · Production</text><rect width="200" height="90" x="500" y="300" fill="#1a1a2e" stroke="#e8c558" stroke-width="2" rx="14"/><text x="600" y="338" fill="#e8c558" font-weight="800" text-anchor="middle">🤖 LLM Call</text><text x="600" y="362" fill="#f0ede6" font-weight="600" text-anchor="middle">foundation model</text><rect width="200" height="90" x="140" y="300" fill="#5ec4c821" stroke="#5ec4c8" stroke-width="2" rx="14"/><text x="240" y="334" fill="#5ec4c8" font-weight="800" text-anchor="middle">RAG</text><text x="240" y="358" fill="#94a3b8" font-weight="600" text-anchor="middle">retrieve · embed · rerank</text><path stroke="#5ec4c8" stroke-width="2.5" marker-end="url(#b)" d="M340 345h160"/><rect width="200" height="90" x="140" y="170" fill="#e8c55821" stroke="#e8c558" stroke-width="2" rx="14"/><text x="240" y="204" fill="#e8c558" font-weight="800" text-anchor="middle">Context</text><text x="240" y="228" fill="#94a3b8" font-weight="600" text-anchor="middle">write · select · compress · isolate</text><path stroke="#e8c558" stroke-width="2.5" marker-end="url(#b)" d="m240 260 360 40"/><rect width="200" height="90" x="500" y="90" fill="#a78bfa21" stroke="#a78bfa" stroke-width="2" rx="14"/><text x="600" y="124" fill="#a78bfa" font-weight="800" text-anchor="middle">Loop</text><text x="600" y="148" fill="#94a3b8" font-weight="600" text-anchor="middle">trigger · terminate · recover</text><path stroke="#a78bfa" stroke-width="2.5" marker-end="url(#b)" d="M600 180v120"/><rect width="200" height="90" x="960" y="170" fill="#c96a5a21" stroke="#c96a5a" stroke-width="2" rx="14"/><text x="1060" y="204" fill="#c96a5a" font-weight="800" text-anchor="middle">Agents</text><text x="1060" y="228" fill="#94a3b8" font-weight="600" text-anchor="middle">tools · planning · memory</text><path stroke="#c96a5a" stroke-width="2.5" marker-end="url(#b)" d="m1060 260-460 40"/><rect width="200" height="90" x="960" y="300" fill="#7fb06921" stroke="#7fb069" stroke-width="2" rx="14"/><text x="1060" y="334" fill="#7fb069" font-weight="800" text-anchor="middle">Production</text><text x="1060" y="358" fill="#94a3b8" font-weight="600" text-anchor="middle">scale · eval · guardrails</text><path stroke="#7fb069" stroke-width="2.5" marker-end="url(#b)" d="M960 345H700"/><text x="600" y="478" fill="#94a3b8" font-weight="600" text-anchor="middle">Each outer layer governs one question: what to fetch, what to show, when to call again, what to delegate, how to ship safely.</text></svg>