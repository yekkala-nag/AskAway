<svg font-family="Syne, sans-serif" viewBox="0 0 1000 360"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient><marker id="c" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#a78bfa" d="m0 0 8 3-8 3Z"/></marker></defs><path fill="url(#a)" d="M0 0h1000v360H0z"/><text x="500" y="40" fill="#c96a5a" font-weight="800" text-anchor="middle">Agentic RAG — Reason, Retrieve, Repeat</text><rect width="200" height="70" x="120" y="140" fill="#1a1a2e" stroke="#e8c558" stroke-width="2" rx="10"/><text x="220" y="175" fill="#e8c558" font-weight="800" text-anchor="middle">🤖 Think</text><path stroke="#c96a5a" stroke-width="2.5" marker-end="url(#b)" d="M320 175h100"/><rect width="200" height="70" x="420" y="140" fill="#c96a5a21" stroke="#c96a5a" stroke-width="2" rx="10"/><text x="520" y="175" fill="#c96a5a" font-weight="800" text-anchor="middle">🔍 Search</text><path stroke="#c96a5a" stroke-width="2.5" marker-end="url(#b)" d="M620 175h100"/><rect width="200" height="70" x="720" y="140" fill="#0f172a" stroke="#c96a5a" stroke-width="2" rx="10"/><text x="820" y="175" fill="#c96a5a" font-weight="800" text-anchor="middle">✅ Answer?</text><path stroke="#a78bfa" stroke-width="2.5" d="M820 140V90"/><rect width="200" height="60" x="720" y="40" fill="#a78bfa21" stroke="#a78bfa" stroke-width="2" rx="10"/><text x="820" y="72" fill="#a78bfa" font-weight="800" text-anchor="middle">refine query → loop</text><path stroke="#a78bfa" stroke-width="2" marker-end="url(#c)" d="m720 70-100 70"/><defs><marker id="b" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#c96a5a" d="m0 0 8 3-8 3Z"/></marker></defs><text x="500" y="300" fill="#94a3b8" font-weight="600" text-anchor="middle">The LLM decides how many retrieval rounds — reformulating the query until it can answer confidently.</text><text x="500" y="325" fill="#a78bfa" font-weight="700" text-anchor="middle">Cap iterations to avoid runaway loops.</text></svg>