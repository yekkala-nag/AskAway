<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 410"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="d" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><marker id="c" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="410" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Handoff transfers · tools consult — pick per query shape</text><text x="40" y="72" fill="#94a3b8" font-size="13">Triage nurse routes; orchestrator merges. Trace proves which ran (1.7s vs 7.2s).</text><g font-size="12" font-weight="700"><rect width="500" height="110" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">Handoff: triage → specialist (control moves)</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">transfer_to_* = LLM-visible functions</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">customize: names · on_handoff · Pydantic input</text><text x="56" y="192" fill="#94a3b8" font-weight="400">ambiguous → clarify, never force</text><rect width="600" height="110" x="560" y="100" fill="url(#b)" rx="10"/><text x="576" y="128" fill="#fff">Agents-as-tools: orchestrator keeps control ✓</text><text x="576" y="150" fill="#d1fae5" font-weight="400">as_tool() consults one or many, merges answers</text><text x="576" y="170" fill="#d1fae5" font-weight="400">custom Runner.run tools fix lat/lon drift</text><text x="576" y="190" fill="#fff" font-weight="400">Jakarta weather + AQI → one caution</text></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#c)"><path d="M250 230v22"/><path d="M850 230v22"/></g><rect width="560" height="60" x="40" y="260" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="284" fill="#fff" font-size="12" font-weight="700">Single domain → handoff · multi-domain → tools · precise inputs → custom</text><text x="60" y="306" fill="#94a3b8" font-size="11">Trace dashboard arbitrates every claim about what ran.</text><rect width="540" height="60" x="620" y="260" fill="url(#d)" rx="10"/><text x="640" y="284" fill="#fff" font-size="12" font-weight="800">Agents SDK + Streamlit + Open-Meteo: real APIs, real traces</text><text x="640" y="306" fill="#e0f2fe" font-size="11">Weather + air-quality specialists, triage nurse up front.</text><rect width="1120" height="30" x="40" y="340" fill="#0f172a" stroke="#334155" rx="8"/><text x="60" y="358" fill="#94a3b8" font-size="11">I. Rahmadhan, TDS · simulator picks the pattern from your query shape.</text></svg>