<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 420"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><linearGradient id="d" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs><rect width="1200" height="420" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">HITL — risk score picks the autonomy level, audit logs everything</text><text x="40" y="72" fill="#94a3b8" font-size="13">score = irreversible(3) + blast(0–3) + low-conf(2) + novel(2) · ≥6 → L1 · ≥3 → L2 · else L3.</text><g font-size="12" font-weight="700"><rect width="340" height="100" x="40" y="100" fill="url(#b)" rx="10"/><text x="56" y="128" fill="#fff">L1 supervised (score ≥6)</text><text x="56" y="150" fill="#fecaca" font-weight="400">approval gate per act</text><text x="56" y="170" fill="#fecaca" font-weight="400">delete · pay · publish</text><text x="56" y="190" fill="#fff" font-weight="400">batch + risk-sort vs fatigue</text><rect width="340" height="100" x="400" y="100" fill="url(#c)" rx="10"/><text x="416" y="128" fill="#fff">L2 bounded (3–5)</text><text x="416" y="150" fill="#ffedd5" font-weight="400">class approval + samples</text><text x="416" y="170" fill="#ffedd5" font-weight="400">refunds &lt; $50 auto</text><text x="416" y="190" fill="#fff" font-weight="400">log overrides, tune threshold</text><rect width="400" height="100" x="760" y="100" fill="url(#d)" rx="10"/><text x="776" y="128" fill="#fff">L3 autonomous (&lt;3) + audit</text><text x="776" y="150" fill="#d1fae5" font-weight="400">reversible · narrow · confident</text><text x="776" y="170" fill="#d1fae5" font-weight="400">read-only monitors</text><text x="776" y="190" fill="#fff" font-weight="400">kill-switch + async review</text></g><rect width="560" height="80" x="40" y="220" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="248" fill="#fff" font-size="13" font-weight="800">Four gates: approve (irreversible) · suggest-edit (drafts) · escalate (low-conf/novel) · audit (always)</text><text x="60" y="272" fill="#94a3b8" font-size="12">Audit never sleeps — but it can&apos;t un-send. Pair with gates for irreversible acts.</text><rect width="540" height="80" x="620" y="220" fill="#0f172a" stroke="#c9a84c" rx="10"/><text x="640" y="248" fill="#c9a84c" font-size="13" font-weight="800">Fatigue defence</text><text x="640" y="272" fill="#e2e8f0" font-size="12">Risk-ordered queues · batch similar · require diff review, never blind approve.</text><rect width="1120" height="60" x="40" y="320" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="346" fill="#94a3b8" font-size="12">Simulator: irreversibility × blast × confidence × novelty → required gate + autonomy + reason.</text></svg>