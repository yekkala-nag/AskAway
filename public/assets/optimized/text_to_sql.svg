<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 400"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><marker id="c" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="400" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Text-to-SQL — link, guard, execute+repair once, interpret</text><text x="40" y="72" fill="#94a3b8" font-size="13">SELECT-only · allow-listed tables · LIMIT/timeout · PII masked. One repair, then escalate.</text><g font-size="12" font-weight="700"><rect width="230" height="90" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">1 · Schema link</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">terms → columns</text><text x="56" y="170" fill="#94a3b8" font-weight="400">premium→schedule</text><rect width="230" height="90" x="290" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="306" y="128" fill="#38bdf8">2 · Guarded gen</text><text x="306" y="150" fill="#e2e8f0" font-weight="400">AST-checked SQL</text><text x="306" y="170" fill="#94a3b8" font-weight="400">SELECT-only</text><rect width="230" height="90" x="540" y="100" fill="url(#b)" rx="10"/><text x="556" y="128" fill="#fff">3 · Execute+repair</text><text x="556" y="150" fill="#d1fae5" font-weight="400">run · fix once</text><text x="556" y="170" fill="#fff" font-weight="400">else escalate</text><rect width="330" height="90" x="790" y="100" fill="#0f172a" stroke="#c9a84c" stroke-width="2" rx="10"/><text x="806" y="128" fill="#c9a84c">4 · Interpret + cite</text><text x="806" y="150" fill="#e2e8f0" font-weight="400">scalar/rows → answer</text><text x="806" y="170" fill="#e2e8f0" font-weight="400">cite SQL + hash</text></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#c)"><path d="M270 145h18"/><path d="M520 145h18"/><path d="M770 145h18"/></g><rect width="560" height="75" x="40" y="215" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="241" fill="#fff" font-size="12" font-weight="700">Difficulty: lookup (low) · aggregate (grain!) · join (fan-out traps — validity dates)</text><text x="60" y="263" fill="#94a3b8" font-size="11">Joins add valid_from&lt;=x&lt;=valid_to — never cross versions silently.</text><rect width="540" height="75" x="620" y="215" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="10"/><text x="640" y="241" fill="#ef4444" font-size="12" font-weight="800">Guards: read-only role · allow-list · LIMIT 200/10s · PII mask+log</text><text x="640" y="263" fill="#e2e8f0" font-size="11">Guards run on AST, not vibes — parse, don&apos;t regex.</text><rect width="1120" height="50" x="40" y="310" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="336" fill="#94a3b8" font-size="12">Simulator: intent × state × coverage → guarded SQL + grain warning + citation.</text></svg>