<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 560"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0d1527"/></linearGradient><linearGradient id="d" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><linearGradient id="e" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><marker id="b" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="560" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Solve the Right Problem — 6 Docs Before Agent Fleet Build</text><text x="40" y="72" fill="#94a3b8" font-size="13">Change is cheap on the blueprint, 10x in production. Agents amplify wrong direction.</text><g font-size="11" font-weight="700"><rect width="160" height="86" x="40" y="110" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="10"/><text x="52" y="134" fill="#10b981">1 · PID.md</text><text x="52" y="152" fill="#e2e8f0" font-weight="400">Business problem,</text><text x="52" y="167" fill="#e2e8f0" font-weight="400">scope, goals</text><text x="52" y="184" fill="#94a3b8" font-weight="400">wrong problem = fatal</text><rect width="160" height="86" x="220" y="110" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="10"/><text x="232" y="134" fill="#10b981">2 · discovery</text><text x="232" y="152" fill="#e2e8f0" font-weight="400">Systems, data,</text><text x="232" y="167" fill="#e2e8f0" font-weight="400">feasibility, risks</text><text x="232" y="184" fill="#94a3b8" font-weight="400">no railroad = no train</text><rect width="160" height="86" x="400" y="110" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="412" y="134" fill="#38bdf8">3 · functional</text><text x="412" y="152" fill="#e2e8f0" font-weight="400">What it must do,</text><text x="412" y="167" fill="#e2e8f0" font-weight="400">users + stories</text><text x="412" y="184" fill="#94a3b8" font-weight="400">Ferrari vs bicycle</text><rect width="160" height="86" x="580" y="110" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="592" y="134" fill="#38bdf8">4 · technical</text><text x="592" y="152" fill="#e2e8f0" font-weight="400">Architecture +</text><text x="592" y="167" fill="#e2e8f0" font-weight="400">reversal cost</text><text x="592" y="184" fill="#94a3b8" font-weight="400">before, not during</text><rect width="160" height="86" x="760" y="110" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="772" y="134" fill="#f59e0b">5 · governance</text><text x="772" y="152" fill="#e2e8f0" font-weight="400">RACI, escalation,</text><text x="772" y="167" fill="#e2e8f0" font-weight="400">approval gates</text><text x="772" y="184" fill="#94a3b8" font-weight="400">no inbox limbo</text><rect width="160" height="86" x="940" y="110" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="952" y="134" fill="#f59e0b">6 · roadmap</text><text x="952" y="152" fill="#e2e8f0" font-weight="400">Order, owners,</text><text x="952" y="167" fill="#e2e8f0" font-weight="400">dependencies</text><text x="952" y="184" fill="#94a3b8" font-weight="400">unblock parallel</text></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#b)"><path d="M200 153h18"/><path d="M380 153h18"/><path d="M560 153h18"/><path d="M740 153h18"/><path d="M920 153h18"/></g><rect width="720" height="150" x="40" y="230" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="258" fill="#fff" font-size="14" font-weight="800">Cost-of-change curve — spend scrutiny where reversal is expensive</text><path stroke="#475569" stroke-width="2" d="M70 340h630m-630 0v-80"/><path fill="none" stroke="#ef4444" stroke-width="3" d="M80 330c170-5 340-30 600-65"/><circle cx="120" cy="328" r="7" fill="#10b981"/><text x="100" y="360" fill="#10b981" font-size="11">blueprint 1x</text><circle cx="380" cy="310" r="7" fill="#f59e0b"/><text x="360" y="360" fill="#f59e0b" font-size="11">build 4x</text><circle cx="650" cy="270" r="7" fill="#ef4444"/><text x="620" y="360" fill="#ef4444" font-size="11">production 10x</text><text x="470" y="285" fill="#94a3b8" font-size="11">data contract / autonomy decisions live here →</text><rect width="380" height="150" x="780" y="230" fill="#0f172a" stroke="#c9a84c" rx="10"/><text x="800" y="258" fill="#c9a84c" font-size="14" font-weight="800">Agent amplification rule</text><text x="800" y="282" fill="#e2e8f0" font-size="12">1 engineer wrong 1 day = limited damage.</text><text x="800" y="302" fill="#e2e8f0" font-size="12">1 engineer × fleet wrong 1 day =</text><text x="800" y="322" fill="#ef4444" font-size="12">pattern copied into every change.</text><rect width="340" height="28" x="800" y="334" fill="url(#c)" rx="6"/><text x="810" y="352" fill="#fff" font-size="11" font-weight="700">Shared playbook: PID → roadmap before fleet</text><rect width="1120" height="120" x="40" y="400" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="428" fill="#fff" font-size="14" font-weight="800">Not waterfall — later discovery updates earlier docs explicitly</text><text x="60" y="450" fill="#94a3b8" font-size="12">Prototype/spike to kill uncertainty → feed result back into the owning doc. Never silently change direction.</text><g font-size="11" font-weight="700"><rect width="250" height="36" x="60" y="462" fill="url(#d)" rx="6"/><text x="72" y="485" fill="#fff">Full: score ≥ 65 (6 docs)</text><rect width="250" height="36" x="330" y="462" fill="url(#e)" rx="6"/><text x="342" y="485" fill="#fff">Lite: 35–64 (PID + discovery)</text><rect width="250" height="36" x="600" y="462" fill="#1e293b" stroke="#475569" rx="6"/><text x="612" y="485" fill="#cbd5e1">Skip: &lt; 35 (reversible fix)</text></g><text x="880" y="485" fill="#94a3b8" font-size="11">Source: Mike Huls, TDS · PPF repo</text></svg>