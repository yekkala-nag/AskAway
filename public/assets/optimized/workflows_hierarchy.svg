<svg font-family="Syne, sans-serif" viewBox="0 0 1100 360"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs><path fill="url(#a)" d="M0 0h1100v360H0z"/><text x="550" y="40" fill="#5ec4c8" font-weight="800" text-anchor="middle">Claude Workflows — Prompt → Chain → Agent</text><rect width="180" height="90" x="80" y="120" fill="#5ec4c821" stroke="#5ec4c8" stroke-width="2" rx="10"/><text x="170" y="158" fill="#5ec4c8" font-weight="800" text-anchor="middle">Prompt</text><text x="170" y="182" fill="#94a3b8" font-weight="600" text-anchor="middle">(1-shot)</text><path stroke="#5ec4c8" stroke-width="2.5" marker-end="url(#b)" d="M260 165h253.333"/><rect width="180" height="90" x="333.333" y="120" fill="#e8c55821" stroke="#e8c558" stroke-width="2" rx="10"/><text x="423.333" y="158" fill="#e8c558" font-weight="800" text-anchor="middle">Chain</text><text x="423.333" y="182" fill="#94a3b8" font-weight="600" text-anchor="middle">(seq steps)</text><path stroke="#e8c558" stroke-width="2.5" marker-end="url(#b)" d="M513.333 165h253.334"/><rect width="180" height="90" x="586.667" y="120" fill="#c96a5a21" stroke="#c96a5a" stroke-width="2" rx="10"/><text x="676.667" y="158" fill="#c96a5a" font-weight="800" text-anchor="middle">Workflow</text><text x="676.667" y="182" fill="#94a3b8" font-weight="600" text-anchor="middle">(branches)</text><path stroke="#c96a5a" stroke-width="2.5" marker-end="url(#b)" d="M766.667 165H1020"/><rect width="180" height="90" x="840" y="120" fill="#a78bfa21" stroke="#a78bfa" stroke-width="2" rx="10"/><text x="930" y="158" fill="#a78bfa" font-weight="800" text-anchor="middle">Agent</text><text x="930" y="182" fill="#94a3b8" font-weight="600" text-anchor="middle">(autonomous)</text><defs><marker id="b" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#a78bfa" d="m0 0 8 3-8 3Z"/></marker></defs><rect width="940" height="60" x="80" y="250" fill="#0f172a" stroke="#475569" stroke-width="2" rx="10"/><text x="550" y="278" fill="#94a3b8" font-weight="600" text-anchor="middle">Escalate only as needed: most tasks are chains; reserve agents for open-ended, multi-step goals.</text><text x="550" y="300" fill="#a78bfa" font-weight="700" text-anchor="middle">Anthropic&apos;s hierarchy: more autonomy = more cost &amp; risk. Earn it.</text></svg>