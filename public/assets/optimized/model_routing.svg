<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 400"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs><rect width="1200" height="400" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Pay only for the thinking each task needs — 0–6 routing</text><text x="40" y="72" fill="#94a3b8" font-size="13">Complexity × reasoning × accumulated context. Cloud query −94%; dense critique stays pro.</text><g font-size="12" font-weight="700"><rect width="330" height="100" x="40" y="100" fill="url(#b)" rx="10"/><text x="56" y="128" fill="#fff">⚡ Fast 0–2 · mini</text><text x="56" y="150" fill="#d1fae5" font-weight="400">retrieval · formatting · scoped plans</text><text x="56" y="170" fill="#d1fae5" font-weight="400">$0.0012/step territory</text><text x="56" y="190" fill="#fff" font-weight="400">identify_security_risks 2/6</text><rect width="330" height="100" x="390" y="100" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="406" y="128" fill="#f59e0b">⚖ Balanced 3–4</text><text x="406" y="150" fill="#e2e8f0" font-weight="400">summaries · comparisons</text><text x="406" y="170" fill="#e2e8f0" font-weight="400">context tips synthesis up</text><text x="406" y="190" fill="#94a3b8" font-weight="400">synthesize_source_data 3/6</text><rect width="420" height="100" x="740" y="100" fill="url(#c)" rx="10"/><text x="756" y="128" fill="#fff">🔥 Powerful 5–6 · pro</text><text x="756" y="150" fill="#fecaca" font-weight="400">tradeoffs · coherence · incentives</text><text x="756" y="170" fill="#fecaca" font-weight="400">14x jumps inside one agent</text><text x="756" y="190" fill="#fff" font-weight="400">no apology for density</text></g><rect width="560" height="70" x="40" y="220" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="246" fill="#fff" font-size="12" font-weight="700">JIT planning kills the global planner: scoped mandates, cheap tier, zero context-blindness</text><text x="60" y="268" fill="#94a3b8" font-size="11">Classification ≪ execution — flash-lite classifies, right-sized models execute.</text><rect width="540" height="70" x="620" y="220" fill="#0f172a" stroke="#c9a84c" rx="10"/><text x="640" y="246" fill="#c9a84c" font-size="12" font-weight="800">Context accumulates downstream — measure it, don&apos;t guess</text><text x="640" y="268" fill="#e2e8f0" font-size="11">Researcher small → Reporter 7–8k. tiktoken exact counts, not vibes.</text><rect width="1120" height="50" x="40" y="310" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="336" fill="#94a3b8" font-size="12">Simulator: grade complexity × reasoning × context → tier + cost. Savings scale inversely with difficulty.</text></svg>