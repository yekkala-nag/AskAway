<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 430"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs><rect width="1200" height="430" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">SR 11-7 for GenAI — same questions, new evidence</text><text x="40" y="72" fill="#94a3b8" font-size="13">No dev sample, no retrain, vendor core, silent drift: replication → test design.</text><g font-size="12" font-weight="700"><rect width="340" height="100" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">1 · Conceptual soundness</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">LLM at all? component map</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">customization justifications</text><text x="56" y="190" fill="#94a3b8" font-weight="400">cheapest challenge first</text><rect width="340" height="100" x="400" y="100" fill="url(#b)" rx="10"/><text x="416" y="128" fill="#fff">2 · Outcomes analysis ★</text><text x="416" y="150" fill="#d1fae5" font-weight="400">dimensions × robustness</text><text x="416" y="170" fill="#d1fae5" font-weight="400">failure clusters, not averages</text><text x="416" y="190" fill="#fff" font-weight="400">the crucial step</text><rect width="400" height="100" x="760" y="100" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="776" y="128" fill="#f59e0b">3 · Ongoing monitoring</text><text x="776" y="150" fill="#e2e8f0" font-weight="400">fabrication · drift · retrieval</text><text x="776" y="170" fill="#e2e8f0" font-weight="400">override rate = control health</text><text x="776" y="190" fill="#94a3b8" font-weight="400">breach plan pre-agreed</text></g><rect width="560" height="70" x="40" y="220" fill="url(#c)" rx="10"/><text x="60" y="246" fill="#fff" font-size="12" font-weight="800">5 breaks: system-not-model · distribution · no ground truth · vendor core · silent drift</text><text x="60" y="268" fill="#fecaca" font-size="11">95% right + 5% confidently wrong ≠ 5% error rate. Fluency ≄ correctness.</text><rect width="540" height="70" x="620" y="220" fill="#0f172a" stroke="#c9a84c" rx="10"/><text x="640" y="246" fill="#c9a84c" font-size="12" font-weight="800">Tiering sets the bar: travel × acts × materiality</text><text x="640" y="268" fill="#e2e8f0" font-size="11">No 100-page report on a low-materiality assistant.</text><rect width="1120" height="80" x="40" y="310" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="336" fill="#fff" font-size="12" font-weight="700">Grounded ≠ true (stale source) · true ≠ usable (unverifiable). Groundedness binds in regulated work.</text><text x="60" y="358" fill="#94a3b8" font-size="11">Judge-the-judge: agreement · position · verbosity · self-preference · recalibration. Unvalidated scorers move risk.</text><text x="60" y="380" fill="#94a3b8" font-size="11">Simulator: exposure × acts × materiality → tier, evidence bar, first move.</text></svg>