<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 400"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs><rect width="1200" height="400" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Ukuflow: 2 hours to build, $52/day to regret</text><text x="40" y="72" fill="#94a3b8" font-size="13">Build was free (credits). Running compounded: 200 users → −$48/day → ~$17k/yr bleed.</text><rect width="520" height="120" x="40" y="100" fill="url(#b)" rx="10"/><text x="60" y="128" fill="#fff" font-size="14" font-weight="800">✕ Live agent per search: −$48/day</text><text x="60" y="152" fill="#fecaca" font-size="12">cost $52 · revenue ~$4 · overkill for lookups</text><text x="60" y="172" fill="#fecaca" font-size="12">market = beginners × ~12 known songs</text><text x="60" y="198" fill="#fff" font-size="11">untested assumption + costly whistle, helpful tree</text><rect width="580" height="120" x="580" y="100" fill="url(#c)" rx="10"/><text x="600" y="128" fill="#fff" font-size="14" font-weight="800">✓ Static-first correction: ~$4 at ~$0</text><text x="600" y="152" fill="#d1fae5" font-size="12">precomputed beginner songs · same users served</text><text x="600" y="172" fill="#d1fae5" font-size="12">MVP offer first: ONE karaoke-scroll page</text><text x="600" y="198" fill="#fff" font-size="11">measure → scale, add, or drop. Agile, not vibes.</text><g font-size="11" font-weight="700"><rect width="250" height="60" x="40" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="56" y="262" fill="#fff">Test assumption</text><text x="56" y="282" fill="#94a3b8" font-weight="400">one page, real feedback</text><rect width="250" height="60" x="310" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="326" y="262" fill="#fff">Static-first</text><text x="326" y="282" fill="#94a3b8" font-weight="400">precompute the stable</text><rect width="250" height="60" x="580" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="596" y="262" fill="#fff">Unit econ day 1</text><text x="596" y="282" fill="#94a3b8" font-weight="400">cost/visit vs rev/visit</text><rect width="250" height="60" x="850" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="866" y="262" fill="#fff">Iterate + listen</text><text x="866" y="282" fill="#94a3b8" font-weight="400">users &gt; agents</text></g><rect width="1120" height="40" x="40" y="320" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="342" fill="#94a3b8" font-size="11">Simulator: visitors × searches × cost vs ad revenue → KILL / STATIC-FIRST / SCALE verdict.</text></svg>