<svg font-family="Syne, sans-serif" viewBox="0 0 1000 360"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs><path fill="url(#a)" d="M0 0h1000v360H0z"/><text x="500" y="40" fill="#5ec4c8" font-weight="800" text-anchor="middle">Context Engineering — 4 Strategies (LangChain)</text><rect width="430" height="110" x="60" y="90" fill="#e8c55821" stroke="#e8c558" stroke-width="2" rx="12"/><text x="84" y="134" fill="#e8c558" font-weight="800">✍️ WRITE</text><text x="84" y="168" fill="#94a3b8" font-weight="600">cache static prompt prefixes</text><rect width="430" height="110" x="510" y="90" fill="#5ec4c821" stroke="#5ec4c8" stroke-width="2" rx="12"/><text x="534" y="134" fill="#5ec4c8" font-weight="800">🎯 SELECT</text><text x="534" y="168" fill="#94a3b8" font-weight="600">retrieve only relevant fragments</text><rect width="430" height="110" x="60" y="220" fill="#c96a5a21" stroke="#c96a5a" stroke-width="2" rx="12"/><text x="84" y="264" fill="#c96a5a" font-weight="800">✂️ COMPRESS</text><text x="84" y="298" fill="#94a3b8" font-weight="600">strip noise, compact window</text><rect width="430" height="110" x="510" y="220" fill="#a78bfa21" stroke="#a78bfa" stroke-width="2" rx="12"/><text x="534" y="264" fill="#a78bfa" font-weight="800">🛡️ ISOLATE</text><text x="534" y="298" fill="#94a3b8" font-weight="600">separate sub-agent memory</text><text x="500" y="330" fill="#94a3b8" font-weight="600" text-anchor="middle">Curate what enters &amp; exits the finite context window between turns — the heart of reliable RAG.</text></svg>