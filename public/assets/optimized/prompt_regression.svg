<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 430"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient><linearGradient id="d" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="e" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><marker id="c" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="430" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Prompt regression — golden set + behavioural diff + canary → rollback</text><text x="40" y="72" fill="#94a3b8" font-size="13">Graph picks the eval set. Regression runs it and judges behaviour — structurally fine can still fail here.</text><g font-size="12" font-weight="700"><rect width="220" height="90" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">1 · CI golden set</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">fixed Q/A per version</text><text x="56" y="170" fill="#94a3b8" font-weight="400">drop &gt;2pp = alert</text><rect width="220" height="90" x="280" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="296" y="128" fill="#38bdf8">2 · Behavioural diff</text><text x="296" y="150" fill="#e2e8f0" font-weight="400">old vs new outputs</text><text x="296" y="170" fill="#94a3b8" font-weight="400">&gt;5% shift = alert</text><rect width="220" height="90" x="520" y="100" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="536" y="128" fill="#f59e0b">3 · Canary 5%</text><text x="536" y="150" fill="#e2e8f0" font-weight="400">shadow errors/cost</text><text x="536" y="170" fill="#94a3b8" font-weight="400">2 red windows = halt</text><rect width="180" height="90" x="760" y="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="10"/><text x="776" y="128" fill="#10b981">4 · Citations</text><text x="776" y="150" fill="#e2e8f0" font-weight="400">unsupported = 0</text><text x="776" y="170" fill="#94a3b8" font-weight="400">gate invariant</text><rect width="200" height="90" x="960" y="100" fill="url(#b)" rx="10"/><text x="976" y="128" fill="#fff">5 · Rollback</text><text x="976" y="150" fill="#fecaca" font-weight="400">pin last-good</text><text x="976" y="170" fill="#fecaca" font-weight="400">tombstone bad ver</text></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#c)"><path d="M260 145h18"/><path d="M500 145h18"/><path d="M740 145h18"/><path d="M940 145h18"/></g><g font-size="12" font-weight="700"><rect width="340" height="60" x="40" y="215" fill="url(#d)" rx="8"/><text x="56" y="240" fill="#fff">SHIP · rate ≥ 0.95</text><text x="56" y="260" fill="#d1fae5" font-weight="400">promote · keep monitoring</text><rect width="340" height="60" x="400" y="215" fill="url(#e)" rx="8"/><text x="416" y="240" fill="#fff">GATE · 0.80–0.95</text><text x="416" y="260" fill="#ffedd5" font-weight="400">inspect diffs · no prod</text><rect width="400" height="60" x="760" y="215" fill="url(#b)" rx="8"/><text x="776" y="240" fill="#fff">ROLLBACK · &lt; 0.80</text><text x="776" y="260" fill="#fecaca" font-weight="400">regressed · add case to golden set</text></g><rect width="1120" height="95" x="40" y="295" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="323" fill="#fff" font-size="13" font-weight="800">Every rollback donates its failing case to the golden set — the suite compounds, quiet failures get louder.</text><text x="60" y="345" fill="#94a3b8" font-size="12">Sits downstream of contracts (may ship?) and dependency graph (what to run?) — this is the run itself.</text><text x="60" y="367" fill="#94a3b8" font-size="11">Simulator: inject noise 0–3 → watch pass rate cross SHIP/GATE/ROLLBACK bands.</text></svg>