<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 430"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><marker id="d" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="430" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Grade the seams, not just the final text</text><text x="40" y="72" fill="#94a3b8" font-size="13">Empty-200 handoffs sail through tone checks. A watchdog between nodes halts them.</text><g font-size="12" font-weight="700"><rect width="300" height="90" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">1 · classify ticket</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">node output: label</text><text x="56" y="170" fill="#94a3b8" font-weight="400">checked: trivially fine</text><rect width="300" height="90" x="380" y="100" fill="url(#b)" rx="10"/><text x="396" y="128" fill="#fff">2 · billing lookup → 200 EMPTY</text><text x="396" y="150" fill="#fecaca" font-weight="400">valid shape, zero records</text><text x="396" y="170" fill="#fff" font-weight="400">eval sees: success ✓ (lie)</text><rect width="200" height="90" x="720" y="100" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="736" y="128" fill="#f59e0b">◉ WATCHDOG</text><text x="736" y="150" fill="#e2e8f0" font-weight="400">IDs match? records?</text><text x="736" y="170" fill="#e2e8f0" font-weight="400">HALT + alert</text><rect width="200" height="90" x="960" y="100" fill="url(#c)" rx="10"/><text x="976" y="128" fill="#fff">3 · draft (gated)</text><text x="976" y="150" fill="#d1fae5" font-weight="400">only clean handoffs</text><text x="976" y="170" fill="#fff" font-weight="400">no polite wrongness</text></g><g stroke="#38bdf8" stroke-width="2" marker-end="url(#d)"><path d="M340 145h38"/><path d="M680 145h38"/><path d="M920 145h38"/></g><rect width="560" height="75" x="40" y="215" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="243" fill="#fff" font-size="12" font-weight="700">Watchdog rules: Pydantic schema · one narrow question · floor 0.35 · fail-closed · gate external acts</text><text x="60" y="265" fill="#94a3b8" font-size="11">Small local model: fast + binary, not clever. Start at the last handoff before externals.</text><rect width="540" height="75" x="620" y="215" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="10"/><text x="640" y="243" fill="#ef4444" font-size="12" font-weight="800">Costs: latency (2 calls) · false halts · judgment</text><text x="640" y="265" fill="#e2e8f0" font-size="11">Gate where being-wrong beats the hop. Final text can lie; trajectory can&apos;t.</text><rect width="1120" height="80" x="40" y="310" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="336" fill="#fff" font-size="12" font-weight="700">Datadog 2026: ~5% AI requests fail · ~40% silently (complete-but-wrong). The expensive failure is the 200, never the 500.</text><text x="60" y="360" fill="#94a3b8" font-size="11">Simulator: empty-200 · ID mismatch · low-confidence vs floor slider → PASS/HALT + reason.</text></svg>