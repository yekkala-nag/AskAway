<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 400"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs><rect width="1200" height="400" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Quantize to serve — 70B: 140GB → 35GB with −1–3%</text><text x="40" y="72" fill="#94a3b8" font-size="13">VRAM = params × bits/8 + KV cache. INT4 AWQ/GPTQ is the single-GPU sweet spot.</text><g font-size="12" font-weight="700"><rect width="200" height="90" x="40" y="100" fill="#0f172a" stroke="#475569" rx="8"/><text x="56" y="126" fill="#fff">FP16 · 140GB</text><text x="56" y="148" fill="#94a3b8" font-weight="400">baseline · eval ref</text><text x="56" y="168" fill="#94a3b8" font-weight="400">4×A100</text><rect width="200" height="90" x="260" y="100" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="276" y="126" fill="#38bdf8">INT8 · 70GB</text><text x="276" y="148" fill="#e2e8f0" font-weight="400">≈ lossless</text><text x="276" y="168" fill="#94a3b8" font-weight="400">1×A100 safe</text><rect width="200" height="90" x="480" y="100" fill="url(#b)" rx="8"/><text x="496" y="126" fill="#fff">INT4 · 35GB ★</text><text x="496" y="148" fill="#d1fae5" font-weight="400">−1–3% bench</text><text x="496" y="168" fill="#fff" font-weight="400">1×80GB serve</text><rect width="200" height="90" x="700" y="100" fill="#0f172a" stroke="#f59e0b" rx="8"/><text x="716" y="126" fill="#f59e0b">GGUF · 40GB</text><text x="716" y="148" fill="#e2e8f0" font-weight="400">CPU/Mac/edge</text><text x="716" y="168" fill="#94a3b8" font-weight="400">llama.cpp</text><rect width="200" height="90" x="920" y="100" fill="#0f172a" stroke="#ef4444" rx="8"/><text x="936" y="126" fill="#ef4444">INT2 · 18GB</text><text x="936" y="148" fill="#e2e8f0" font-weight="400">visible loss</text><text x="936" y="168" fill="#94a3b8" font-weight="400">eval first!</text></g><rect width="560" height="70" x="40" y="210" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="236" fill="#fff" font-size="12" font-weight="700">Stacks: vLLM throughput · TensorRT p99 · TGI HF-native · llama.cpp edge</text><text x="60" y="258" fill="#94a3b8" font-size="11">KV cache grows with context — 32k ctx adds ~10GB on 70B. Budget it.</text><rect width="540" height="70" x="620" y="210" fill="url(#b)" rx="10"/><text x="640" y="236" fill="#fff" font-size="12" font-weight="700">Rule: eval FP16 once, serve INT4, edge GGUF</text><text x="640" y="258" fill="#d1fae5" font-size="11">Quality deltas are benchmark-measured, never assumed.</text><rect width="1120" height="60" x="40" y="300" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="326" fill="#94a3b8" font-size="12">Simulator: params × bits × context × GPUs → weights/KV/total + stack pick.</text></svg>