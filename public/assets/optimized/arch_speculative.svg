<svg font-family="Syne, sans-serif" viewBox="0 0 1100 320"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs><path fill="url(#a)" d="M0 0h1100v320H0z"/><text x="550" y="40" fill="#a78bfa" font-weight="800" text-anchor="middle">Speculative Decoding — Draft, then Verify in Parallel</text><rect width="200" height="70" x="70" y="110" fill="#a78bfa21" stroke="#a78bfa" stroke-width="2" rx="10"/><text x="170" y="140" fill="#a78bfa" font-weight="800" text-anchor="middle">Small draft model</text><text x="170" y="162" fill="#94a3b8" font-weight="600" text-anchor="middle">proposes k tokens</text><path stroke="#a78bfa" stroke-width="2.5" marker-end="url(#b)" d="M270 145h110"/><rect width="200" height="70" x="380" y="110" fill="#0f172a" stroke="#a78bfa" stroke-width="2" rx="10"/><text x="480" y="140" fill="#a78bfa" font-weight="800" text-anchor="middle">Big target model</text><text x="480" y="162" fill="#94a3b8" font-weight="600" text-anchor="middle">verifies all at once</text><defs><marker id="b" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#a78bfa" d="m0 0 8 3-8 3Z"/></marker></defs><text x="690" y="135" fill="#7fb069" font-weight="800" text-anchor="middle">→ accept</text><text x="690" y="158" fill="#c96a5a" font-weight="700" text-anchor="middle">reject + resample</text><rect width="330" height="70" x="700" y="110" fill="#0f172a" stroke="#475569" stroke-width="2" rx="10"/><text x="865" y="140" fill="#f1f5f9" font-size="14" font-weight="800" text-anchor="middle">2–4× throughput, lossless</text><text x="865" y="162" fill="#94a3b8" font-weight="600" text-anchor="middle">quality identical to big model</text><text x="550" y="290" fill="#94a3b8" font-weight="600" text-anchor="middle">A cheap model guesses several tokens; the flagship validates them in a single forward pass.</text></svg>