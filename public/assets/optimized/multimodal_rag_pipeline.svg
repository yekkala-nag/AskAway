<svg font-family="Syne, sans-serif" viewBox="0 0 1200 280"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#0e1a2e"/></linearGradient></defs><rect width="1200" height="280" fill="url(#a)" rx="12"/><text x="600" y="36" fill="#f0a89a" font-size="20" font-weight="800" text-anchor="middle">Multimodal RAG Pipeline  Parse � Summarize � Store � Query</text><g font-size="12" font-weight="700"><rect width="250" height="90" x="40" y="70" fill="#0f172a" stroke="#5ec4c8" stroke-width="2" rx="10"/><text x="165" y="100" fill="#5ec4c8" text-anchor="middle">1 � Parse</text><text x="165" y="122" fill="#94a3b8" font-weight="500" text-anchor="middle">Text chunks + image files</text><text x="165" y="142" fill="#cbd5e1" font-weight="500" text-anchor="middle">tables structured</text><path stroke="#5ec4c8" stroke-width="2" marker-end="url(#b)" d="M290 115h30"/><rect width="250" height="90" x="320" y="70" fill="#0f172a" stroke="#5ec4c8" stroke-width="2" rx="10"/><text x="445" y="100" fill="#5ec4c8" text-anchor="middle">2 � Summarize</text><text x="445" y="122" fill="#94a3b8" font-weight="500" text-anchor="middle">Searchable image captions</text><text x="445" y="142" fill="#cbd5e1" font-weight="500" text-anchor="middle">index-time vision calls</text><path stroke="#5ec4c8" stroke-width="2" marker-end="url(#b)" d="M570 115h30"/><rect width="250" height="90" x="600" y="70" fill="#0f172a" stroke="#f0a89a" stroke-width="2" rx="10"/><text x="725" y="100" fill="#f0a89a" text-anchor="middle">3 � Store</text><text x="725" y="122" fill="#94a3b8" font-weight="500" text-anchor="middle">Vector + docstore IDs</text><text x="725" y="142" fill="#cbd5e1" font-weight="500" text-anchor="middle">multi-vector retriever</text><path stroke="#f0a89a" stroke-width="2" marker-end="url(#b)" d="M850 115h30"/><rect width="280" height="90" x="880" y="70" fill="#0f172a" stroke="#c9b8e8" stroke-width="2" rx="10"/><text x="1020" y="100" fill="#c9