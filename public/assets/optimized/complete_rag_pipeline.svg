<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 780"><defs><linearGradient id="cpbg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#101a30"/><stop offset="100%" stop-color="#101a30"/></linearGradient></defs><style>@keyframes flowmv{to{stroke-dashoffset:-16}}</style><rect width="1200" height="780" fill="url(#cpbg)" rx="12"/><rect width="250" height="42" x="630" y="18" fill="#0f172a" rx="6"/><text x="40" y="50" fill="#f1f5f9" font-size="34" font-weight="900">THE COMPLETE <tspan x="640" y="50">RAG PIPELINE</tspan></text><g font-size="12" font-weight="800" text-anchor="middle"><rect width="140" height="32" x="40" y="92" fill="#0f172a" rx="6"/><text x="110" y="113" fill="#f1f5f9">STAGE 1</text><rect width="140" height="32" x="40" y="252" fill="#0f172a" rx="6"/><text x="110" y="273" fill="#f1f5f9">STAGE 2</text><rect width="140" height="32" x="40" y="412" fill="#0f172a" rx="6"/><text x="110" y="433" fill="#f1f5f9">STAGE 3</text><rect width="140" height="32" x="40" y="572" fill="#0f172a" rx="6"/><text x="110" y="593" fill="#f1f5f9">STAGE 4</text><rect width="140" height="56" x="40" y="128" fill="#0f172a" stroke="#5ec4c8" stroke-width="2" rx="6"/><text x="110" y="152" fill="#f1f5f9">INGESTION</text><rect width="140" height="56" x="40" y="288" fill="#0f172a" stroke="#a78bfa" stroke-width="2" rx="6"/><text x="110" y="312" fill="#f1f5f9">INDEXING</text><rect width="140" height="56" x="40" y="448" fill="#0f172a" stroke="#e8c558" stroke-width="2" rx="6"/><text x="110" y="472" fill="#f1f5f9">RETRIEVAL</text><rect width="140" height="56" x="40" y="608" fill="#0f172a" stroke="#c96a5a" stroke-width="2" rx="6"/><text x="110" y="626" fill="#f1f5f9" font-size="10">GENERATION</text><text x="110" y="642" fill="#f1f5f9" font-size="10">&amp; CHECK</text></g><g fill="none" stroke-width="3" style="stroke-dasharray:8 8;animation:flowmv 1.4s linear infinite"><path stroke="#5ec4c8" d="M110 184v64"/><path stroke="#a78bfa" d="M110 344v64"/><path stroke="#e8c558" d="M110 504v64"/><path stroke="#5ec4c8" d="M420 150h240"/><path stroke="#a78bfa" d="M420 310h240"/><path stroke="#e8c558" d="M420 470h240"/><path stroke="#c96a5a" d="M420 630h240"/></g><g font-size="11"><rect width="220" height="112" x="200" y="92" fill="#0f172a" stroke="#5ec4c8" rx="8"/><text x="214" y="116" fill="#f1f5f9" font-size="14" font-weight="800">Source Collection</text><text x="214" y="134" fill="#f1f5f9">• Pull PDFs, APIs, sites</text><text x="214" y="150" fill="#f1f5f9">• Transcripts + raw text</text><text x="214" y="166" fill="#f1f5f9">• All downstream depends</text><text x="214" y="186" fill="#ef4444">✕ gap = silent miss</text><rect width="220" height="112" x="440" y="92" fill="#0f172a" stroke="#5ec4c8" rx="8"/><text x="454" y="116" fill="#f1f5f9" font-size="14" font-weight="800">Document Loading</text><text x="454" y="134" fill="#f1f5f9">• Normalize formats</text><text x="454" y="150" fill="#f1f5f9">• Prep files for chunking</text><text x="454" y="166" fill="#ef4444">✕ formats break parsing</text><rect width="220" height="112" x="680" y="92" fill="#0f172a" stroke="#5ec4c8" rx="8"/><text x="694" y="116" fill="#f1f5f9" font-size="14" font-weight="800">Semantic Chunking</text><text x="694" y="134" fill="#f1f5f9">• Meaning, not length</text><text x="694" y="150" fill="#f1f5f9">• Keep boundaries</text><text x="694" y="166" fill="#ef4444">✕ fail → noisy retrieval</text><rect width="240" height="112" x="920" y="92" fill="#0f172a" stroke="#475569" rx="8"/><text x="934" y="116" fill="#f1f5f9" font-size="13" font-weight="800">Try it live ↓</text><text x="934" y="134" fill="#f1f5f9">toggle any step off,</text><text x="934" y="150" fill="#f1f5f9">watch scores move.</text><text x="934" y="170" fill="#5ec4c8" font-weight="700">12 steps · animated</text><rect width="220" height="112" x="200" y="252" fill="#0f172a" stroke="#a78bfa" rx="8"/><text x="214" y="276" fill="#f1f5f9" font-size="14" font-weight="800">Vector Store</text><text x="214" y="294" fill="#f1f5f9">• Fast lookup at scale</text><text x="214" y="310" fill="#f1f5f9">• Searchable KB out</text><rect width="220" height="112" x="440" y="252" fill="#0f172a" stroke="#a78bfa" rx="8"/><text x="454" y="276" fill="#f1f5f9" font-size="14" font-weight="800">Vector Embeddings</text><text x="454" y="294" fill="#f1f5f9">• Meaning → vectors</text><text x="454" y="310" fill="#ef4444">✕ off = full halt</text><rect width="220" height="112" x="680" y="252" fill="#0f172a" stroke="#a78bfa" rx="8"/><text x="694" y="276" fill="#f1f5f9" font-size="14" font-weight="800">Metadata Tagging</text><text x="694" y="294" fill="#f1f5f9">• Author·title·tags</text><text x="694" y="310" fill="#ef4444">✕ skip → precision dives</text><rect width="240" height="112" x="920" y="252" fill="#0f172a" stroke="#475569" rx="8"/><text x="934" y="276" fill="#f1f5f9" font-size="13" font-weight="800">Live runner →</text><text x="934" y="294" fill="#f1f5f9">stages light up in order,</text><text x="934" y="310" fill="#f1f5f9">metrics count up.</text><text x="934" y="330" fill="#e08a4c" font-weight="700">honest, deterministic</text><rect width="220" height="112" x="200" y="412" fill="#0f172a" stroke="#e8c558" rx="8"/><text x="214" y="436" fill="#f1f5f9" font-size="14" font-weight="800">Query Rewriting</text><text x="214" y="454" fill="#f1f5f9">• Clarify vague queries</text><text x="214" y="470" fill="#f1f5f9">• Sharper in → sharper out</text><text x="214" y="490" fill="#ef4444">✕ recall −30%</text><rect width="220" height="112" x="440" y="412" fill="#0f172a" stroke="#e8c558" rx="8"/><text x="454" y="436" fill="#f1f5f9" font-size="14" font-weight="800">Hybrid Search</text><text x="454" y="454" fill="#f1f5f9">• Vector + keyword</text><text x="454" y="470" fill="#f1f5f9">• Covers vector gaps</text><rect width="220" height="112" x="680" y="412" fill="#0f172a" stroke="#e8c558" rx="8"/><text x="694" y="436" fill="#f1f5f9" font-size="14" font-weight="800">Reranking</text><text x="694" y="454" fill="#f1f5f9">• True relevance model</text><text x="694" y="470" fill="#ef4444">✕ distractor leads top-k</text><rect width="240" height="112" x="920" y="412" fill="#0f172a" stroke="#e8c558" rx="8"/><text x="934" y="436" fill="#f1f5f9" font-size="13" font-weight="800">k slider + 3 queries</text><text x="934" y="454" fill="#f1f5f9">refund · deductible</text><text x="934" y="470" fill="#f1f5f9">escalation — try all</text><rect width="220" height="128" x="200" y="572" fill="#0f172a" stroke="#c96a5a" rx="8"/><text x="214" y="596" fill="#f1f5f9" font-size="14" font-weight="800">Evaluation</text><text x="214" y="614" fill="#f1f5f9">• Faithfulness·latency·cost</text><text x="214" y="630" fill="#f1f5f9">• Citations vs sources</text><text x="214" y="646" fill="#ef4444">✕ skip → drift invisible</text><text x="214" y="662" fill="#94a3b8">runs FIRST in display,</text><text x="214" y="676" fill="#94a3b8">LAST in pipeline</text><rect width="220" height="128" x="440" y="572" fill="#0f172a" stroke="#c96a5a" rx="8"/><text x="454" y="596" fill="#f1f5f9" font-size="14" font-weight="800">Answer Generation</text><text x="454" y="614" fill="#f1f5f9">• Grounded in retrieval</text><text x="454" y="630" fill="#ef4444">✕ no retrieval = invent</text><text x="454" y="646" fill="#94a3b8">the only LLM call</text><text x="454" y="662" fill="#94a3b8">that faces the user</text><rect width="220" height="128" x="680" y="572" fill="#0f172a" stroke="#c96a5a" rx="8"/><text x="694" y="596" fill="#f1f5f9" font-size="14" font-weight="800">Context Assembly</text><text x="694" y="614" fill="#f1f5f9">• Order + compress</text><text x="694" y="630" fill="#f1f5f9">• Fit signal in prompt</text><text x="694" y="646" fill="#ef4444">✕ raw stuff truncates best</text><rect width="240" height="128" x="920" y="572" fill="#0f172a" rx="8"/><text x="934" y="596" fill="#fff" font-size="13" font-weight="800">The thesis, small:</text><text x="934" y="616" fill="#c96a5a" font-size="12">order decides quality —</text><text x="934" y="634" fill="#c96a5a" font-size="12">ingest → index →</text><text x="934" y="652" fill="#c96a5a" font-size="12">retrieve → check.</text><text x="934" y="674" fill="#94a3b8">Skip check → ship drift.</text></g></svg>