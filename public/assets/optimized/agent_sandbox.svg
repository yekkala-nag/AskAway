<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 420"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs><rect width="1200" height="420" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Sandbox tiers — deny by default, broker secrets, key every mutation</text><text x="40" y="72" fill="#94a3b8" font-size="13">Code exec is critical. Secret.read never reaches the model. Mutations carry idempotency keys.</text><g font-size="12" font-weight="700"><rect width="250" height="110" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">T0 read-only</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">search · read · draft</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">blocks all mutation</text><text x="56" y="194" fill="#94a3b8" font-weight="400">research default</text><rect width="250" height="110" x="310" y="100" fill="url(#b)" rx="10"/><text x="326" y="128" fill="#fff">T1 staged (default)</text><text x="326" y="150" fill="#d1fae5" font-weight="400">PRs · jailed exec</text><text x="326" y="170" fill="#d1fae5" font-weight="400">no net · 30s/512MB</text><text x="326" y="194" fill="#fff" font-weight="400">code + content</text><rect width="250" height="110" x="580" y="100" fill="#0f172a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="596" y="128" fill="#f59e0b">T2 scoped prod</text><text x="596" y="150" fill="#e2e8f0" font-weight="400">allow-list APIs</text><text x="596" y="170" fill="#e2e8f0" font-weight="400">budgets + HITL</text><text x="596" y="194" fill="#94a3b8" font-weight="400">refunds &lt; cap</text><rect width="250" height="110" x="850" y="100" fill="url(#c)" rx="10"/><text x="866" y="128" fill="#fff">T3 break-glass</text><text x="866" y="150" fill="#fecaca" font-weight="400">dual approval</text><text x="866" y="170" fill="#fecaca" font-weight="400">just-in-time only</text><text x="866" y="194" fill="#fff" font-weight="400">incidents</text></g><rect width="560" height="80" x="40" y="230" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="10"/><text x="60" y="258" fill="#ef4444" font-size="13" font-weight="800">Confused deputy: tool output is data, never instruction</text><text x="60" y="282" fill="#e2e8f0" font-size="12">Quarantine retrieved content · instruction hierarchy: system &gt; developer &gt; tool output.</text><rect width="540" height="80" x="620" y="230" fill="#0f172a" stroke="#c9a84c" rx="10"/><text x="640" y="258" fill="#c9a84c" font-size="13" font-weight="800">Secrets: brokered 5-min creds</text><text x="640" y="282" fill="#e2e8f0" font-size="12">Model never sees raw values · standing secrets = incident.</text><rect width="1120" height="50" x="40" y="330" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="356" fill="#94a3b8" font-size="12">Simulator: tool set × prod × secrets → tier + control checklist.</text></svg>