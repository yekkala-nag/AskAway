<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 580"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#0a0e1c"/></linearGradient><linearGradient id="b" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><marker id="c" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 1 7 3-7 3Z"/></marker></defs><rect width="1200" height="580" fill="url(#a)" rx="12"/><path stroke="#fff" stroke-opacity=".04" d="M60 0v580M300 0v580M600 0v580M900 0v580M1140 0v580M0 100h1200M0 280h1200M0 460h1200"/><rect width="1120" height="60" x="40" y="24" fill="#111827" fill-opacity=".6" stroke="#1f2937" rx="8"/><text x="60" y="52" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing=".5">RAG CHUNKING STRATEGY TAXONOMY &amp; DECISION MATRIX</text><text x="60" y="70" fill="#94a3b8" font-size="12">From Naive Fixed-Size Windowing to Hierarchical Parent-Child, Anthropic Contextual Retrieval &amp; Jina Late Chunking</text><rect width="160" height="28" x="980" y="38" fill="#0369a1" fill-opacity=".3" stroke="#38bdf8" rx="6"/><text x="1060" y="56" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">⚡ RAG PIPELINE v3.2</text><g transform="translate(40 100)"><rect width="265" height="380" fill="url(#b)" stroke="#ef4444" stroke-opacity=".4" stroke-width="1.5" rx="10"/><rect width="265" height="40" fill="#ef4444" fill-opacity=".15" rx="10"/><text x="16" y="25" fill="#f87171" font-size="14" font-weight="700">1. Naive Fixed-Size</text><rect width="68" height="20" x="185" y="10" fill="#ef4444" fill-opacity=".25" rx="4"/><text x="219" y="24" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">HIGH RISK</text><rect width="233" height="70" x="16" y="55" fill="#0f172a" stroke="#334155" rx="6"/><text x="26" y="75" fill="#94a3b8" font-family="monospace" font-size="10">Doc: [--- Chunk 1 ---] |</text><path stroke="#ef4444" stroke-dasharray="3,3" stroke-width="2" d="M160 60v60"/><text x="165" y="90" fill="#ef4444" font-size="9" font-weight="bold">CUT MID-SENTENCE</text><text x="26" y="108" fill="#94a3b8" font-family="monospace" font-size="10">|[--- Chunk 2 ---]</text><text x="16" y="145" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text><text x="16" y="165" fill="#94a3b8" font-size="11">• Hard token/char count (e.g. 500t)</text><text x="16" y="185" fill="#94a3b8" font-size="11">• Constant sliding overlap (10%)</text><text x="16" y="205" fill="#f87171" font-size="11">• Severed clauses &amp; table rows</text><text x="16" y="225" fill="#f87171" font-size="11">• Lost header context</text><rect width="233" height="85" x="16" y="245" fill="#090d16" stroke="#1e293b" rx="6"/><text x="26" y="265" fill="#94a3b8" font-size="10">Retrieval Precision:</text><text x="235" y="265" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">42% (Poor)</text><text x="26" y="285" fill="#94a3b8" font-size="10">Ingestion Latency:</text><text x="235" y="285" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">&lt; 1ms (Instant)</text><text x="26" y="305" fill="#94a3b8" font-size="10">Compute Cost:</text><text x="235" y="305" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">$ (Minimal)</text><text x="26" y="322" fill="#94a3b8" font-size="10">Context Retention:</text><text x="235" y="322" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">35%</text><rect width="233" height="28" x="16" y="340" fill="#ef4444" fill-opacity=".1" stroke="#ef4444" stroke-opacity=".3" rx="4"/><text x="132" y="358" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">⚠️ Only for simple raw logs</text></g><g transform="translate(325 100)"><rect width="265" height="380" fil