<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 440"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient><linearGradient id="d" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs><rect width="1200" height="440" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">RAG eval triad — precision · recall · faithfulness → ship / gate / rebuild</text><text x="40" y="72" fill="#94a3b8" font-size="13">Low faithfulness = generation fault (contract first). Low recall = retrieval fault (prompt won&apos;t save it).</text><g font-size="12" font-weight="700"><rect width="340" height="110" x="40" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="56" y="128" fill="#38bdf8">Context precision (≥0.8)</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">relevant ÷ retrieved</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">fix: filter · rerank · cut k</text><text x="56" y="194" fill="#94a3b8" font-weight="400">noise in → noise out</text><rect width="340" height="110" x="400" y="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="10"/><text x="416" y="128" fill="#38bdf8">Context recall (≥0.85)</text><text x="416" y="150" fill="#e2e8f0" font-weight="400">found ÷ needed</text><text x="416" y="170" fill="#e2e8f0" font-weight="400">fix: raise k · HyDE · overlap</text><text x="416" y="194" fill="#94a3b8" font-weight="400">blind retriever = empty answer</text><rect width="400" height="110" x="760" y="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="10"/><text x="776" y="128" fill="#10b981">Faithfulness (≥0.95)</text><text x="776" y="150" fill="#e2e8f0" font-weight="400">supported claims ÷ all claims</text><text x="776" y="170" fill="#e2e8f0" font-weight="400">fix: cite-or-refuse contract</text><text x="776" y="194" fill="#94a3b8" font-weight="400">the ship-gate, non-negotiable</text></g><g font-size="12" font-weight="700"><rect width="340" height="70" x="40" y="230" fill="url(#b)" rx="8"/><text x="56" y="256" fill="#fff">SHIP · faith ≥0.95 + prec ≥0.8</text><text x="56" y="278" fill="#d1fae5" font-weight="400">promote · monitor 5%</text><rect width="340" height="70" x="400" y="230" fill="url(#c)" rx="8"/><text x="416" y="256" fill="#fff">GATE · faith 0.85–0.95</text><text x="416" y="278" fill="#ffedd5" font-weight="400">block · fix top claim pattern</text><rect width="400" height="70" x="760" y="230" fill="url(#d)" rx="8"/><text x="776" y="256" fill="#fff">REBUILD · faith &lt;0.85 or recall &lt;0.7</text><text x="776" y="278" fill="#fecaca" font-weight="400">retrieval rebuild, not prompt tuning</text></g><rect width="1120" height="80" x="40" y="320" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="348" fill="#fff" font-size="13" font-weight="800">Answer relevance (≥0.85) sits beside the triad: does the answer address the question? → question-parsing loop.</text><text x="60" y="372" fill="#94a3b8" font-size="12">Simulator below: slide retrieved/relevant/needed/found/claims/supported → band + which layer to fix.</text></svg>