<svg font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1200 410"><defs><linearGradient id="a" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient><linearGradient id="c" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="b" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs><rect width="1200" height="410" fill="url(#a)" rx="12"/><text x="40" y="48" fill="#fff" font-size="24" font-weight="800">FinOps — cache removes calls, routing downgrades the rest</text><text x="40" y="72" fill="#94a3b8" font-size="13">Cheapest token is the un-sent one. 500k calls/mo flagship-only ≈ $11k → cached+routed ≈ $3k.</text><rect width="520" height="120" x="40" y="100" fill="url(#b)" rx="10"/><text x="60" y="128" fill="#fff" font-size="14" font-weight="800">✕ Flagship-only: ~$11,250/mo</text><text x="60" y="152" fill="#fecaca" font-size="12">500k × (3k in @ $5 + 0.5k out @ $15)</text><text x="60" y="174" fill="#fecaca" font-size="12">no cache · no routing · full context k</text><text x="60" y="202" fill="#fff" font-size="11">every call pays flagship price</text><rect width="580" height="120" x="580" y="100" fill="url(#c)" rx="10"/><text x="600" y="128" fill="#fff" font-size="14" font-weight="800">✓ Cache 30% + route 60%: ~$3,100/mo (−72%)</text><text x="600" y="152" fill="#d1fae5" font-size="12">semantic cache kills repeats · mini handles routed 60%</text><text x="600" y="174" fill="#d1fae5" font-size="12">filter-first cuts calls · rerank cuts context</text><text x="600" y="202" fill="#fff" font-size="11">same answers, ~quarter the bill</text><g font-size="11" font-weight="700"><rect width="205" height="60" x="40" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="52" y="262" fill="#fff">Route 5–10x</text><text x="52" y="282" fill="#94a3b8" font-weight="400">mini + margin</text><rect width="205" height="60" x="260" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="272" y="262" fill="#fff">Cache 30–60%</text><text x="272" y="282" fill="#94a3b8" font-weight="400">TTL + tenant</text><rect width="205" height="60" x="480" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="492" y="262" fill="#fff">Call less 40–70%</text><text x="492" y="282" fill="#94a3b8" font-weight="400">filter first</text><rect width="205" height="60" x="700" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="712" y="262" fill="#fff">Compress 20–40%</text><text x="712" y="282" fill="#94a3b8" font-weight="400">L1/L2 ladder</text><rect width="205" height="60" x="920" y="240" fill="#0f172a" stroke="#38bdf8" rx="8"/><text x="932" y="262" fill="#fff">Rerank 50% ctx</text><text x="932" y="282" fill="#94a3b8" font-weight="400">top-50→top-5</text></g><rect width="1120" height="50" x="40" y="320" fill="#0f172a" stroke="#334155" rx="10"/><text x="60" y="346" fill="#94a3b8" font-size="12">Simulator: calls × tokens × routed% × cached% → full vs optimized bill + savings.</text></svg>