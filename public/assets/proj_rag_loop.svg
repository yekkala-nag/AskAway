<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <linearGradient id="rlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#2a1018"/></linearGradient>
  <linearGradient id="rlacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E8837A"/><stop offset="100%" stop-color="#C47A6A"/></linearGradient>
  <marker id="rlarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#E8837A"/></marker>
</defs>
<rect width="1200" height="470" fill="url(#rlbg)" rx="12"/>
<text x="40" y="46" fill="#fff" font-size="24" font-weight="800">The retrieval loop, built by hand</text>
<text x="40" y="70" fill="#94a3b8" font-size="13">Chunk → embed → score → rank → prompt. Four projects add one hard case each.</text>

<g font-size="12" font-weight="700">
  <rect x="40" y="104" width="230" height="104" rx="10" fill="#0f172a" stroke="#E8837A" stroke-width="2"/>
  <text x="58" y="132" fill="#E8837A">Chunk</text>
  <text x="58" y="156" fill="#e2e8f0" font-weight="400">size − overlap = stride</text>
  <text x="58" y="178" fill="#e2e8f0" font-weight="400">500 / 100 → 400</text>
  <text x="58" y="198" fill="#94a3b8" font-weight="400">boundaries decide recall</text>

  <rect x="310" y="104" width="230" height="104" rx="10" fill="#0f172a" stroke="#E8837A" stroke-width="2"/>
  <text x="328" y="132" fill="#E8837A">Embed</text>
  <text x="328" y="156" fill="#e2e8f0" font-weight="400">MiniLM 384-d</text>
  <text x="328" y="178" fill="#e2e8f0" font-weight="400">normalise before dot</text>
  <text x="328" y="198" fill="#94a3b8" font-weight="400">cost paid once per chunk</text>

  <rect x="580" y="104" width="230" height="104" rx="10" fill="#0f172a" stroke="#E8837A" stroke-width="2"/>
  <text x="598" y="132" fill="#E8837A">Score &amp; rank</text>
  <text x="598" y="156" fill="#e2e8f0" font-weight="400">cosine: higher is better</text>
  <text x="598" y="178" fill="#e2e8f0" font-weight="400">Chroma distance: lower</text>
  <text x="598" y="198" fill="#94a3b8" font-weight="400">sort direction is the bug</text>

  <rect x="850" y="104" width="310" height="104" rx="10" fill="url(#rlacc)"/>
  <text x="868" y="132" fill="#1a0d0b">Generate with context</text>
  <text x="868" y="156" fill="#1a0d0b" font-weight="400">top-k passages into one prompt</text>
  <text x="868" y="178" fill="#1a0d0b" font-weight="400">answer names its source</text>
  <text x="868" y="198" fill="#3d1e19" font-weight="400">citation or it is a guess</text>
</g>

<path d="M270,156 L306,156" stroke="#E8837A" stroke-width="2" marker-end="url(#rlarr)"/>
<path d="M540,156 L576,156" stroke="#E8837A" stroke-width="2" marker-end="url(#rlarr)"/>
<path d="M810,156 L846,156" stroke="#E8837A" stroke-width="2" marker-end="url(#rlarr)"/>

<g font-size="12" font-weight="700">
  <text x="40" y="256" fill="#94a3b8" font-size="11">FOUR ESCALATIONS</text>
  <rect x="40" y="268" width="270" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="292" fill="#5EC4C8">Single index</text>
  <text x="58" y="314" fill="#94a3b8" font-weight="400">one corpus, flat search</text>
  <text x="58" y="334" fill="#94a3b8" font-weight="400">the baseline to beat</text>

  <rect x="330" y="268" width="270" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="348" y="292" fill="#5EC4C8">Multi-collection</text>
  <text x="348" y="314" fill="#94a3b8" font-weight="400">category per store</text>
  <text x="348" y="334" fill="#94a3b8" font-weight="400">merge, keep the label</text>

  <rect x="620" y="268" width="270" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="292" fill="#5EC4C8">GraphRAG</text>
  <text x="638" y="314" fill="#94a3b8" font-weight="400">entities + relations</text>
  <text x="638" y="334" fill="#94a3b8" font-weight="400">helps only if named</text>

  <rect x="910" y="268" width="250" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="928" y="292" fill="#5EC4C8">Conversational</text>
  <text x="928" y="314" fill="#94a3b8" font-weight="400">rewrite with history</text>
  <text x="928" y="334" fill="#94a3b8" font-weight="400">memory costs tokens</text>
</g>

<rect x="40" y="380" width="1120" height="62" rx="10" fill="#0f172a" stroke="#E8837A" stroke-width="1.5"/>
<text x="60" y="406" fill="#E8837A" font-size="12" font-weight="700">Retrieval is a ranking problem, not a generation problem.</text>
<text x="60" y="428" fill="#94a3b8" font-size="11" font-weight="400">If the right chunk is not in the top-k, no prompt fixes it. Measure recall@k before you tune the answer.</text>
</svg>
