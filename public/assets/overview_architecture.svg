<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Syne, sans-serif">
<defs>
 <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#A78BFA"/></marker>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#090d16"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="520" fill="url(#bg)"/>
<text x="600" y="42" font-family="Syne, sans-serif" font-weight="800" fill="#F1F5F9" text-anchor="middle">Modern AI Systems — Five Interlocking Layers</text>
<text x="600" y="68" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">A single LLM call, wrapped by RAG · Context · Loop · Agents · Production</text>
<rect x="500" y="300" width="200" height="90" rx="14" fill="#1a1a2e" stroke="#E8C558" stroke-width="2"/>
<text x="600" y="338" font-family="Syne, sans-serif" font-weight="800" fill="#E8C558" text-anchor="middle">🤖 LLM Call</text>
<text x="600" y="362" font-family="Syne, sans-serif" font-weight="600" fill="#f0ede6" text-anchor="middle">foundation model</text>
<rect x="140" y="300" width="200" height="90" rx="14" fill="#5EC4C821" stroke="#5EC4C8" stroke-width="2"/>
<text x="240" y="334" font-family="Syne, sans-serif" font-weight="800" fill="#5EC4C8" text-anchor="middle">RAG</text>
<text x="240" y="358" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">retrieve · embed · rerank</text>
<line x1="340" y1="345" x2="500" y2="345" stroke="#5EC4C8" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="140" y="170" width="200" height="90" rx="14" fill="#E8C55821" stroke="#E8C558" stroke-width="2"/>
<text x="240" y="204" font-family="Syne, sans-serif" font-weight="800" fill="#E8C558" text-anchor="middle">Context</text>
<text x="240" y="228" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">write · select · compress · isolate</text>
<line x1="240" y1="260" x2="600" y2="300" stroke="#E8C558" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="500" y="90" width="200" height="90" rx="14" fill="#A78BFA21" stroke="#A78BFA" stroke-width="2"/>
<text x="600" y="124" font-family="Syne, sans-serif" font-weight="800" fill="#A78BFA" text-anchor="middle">Loop</text>
<text x="600" y="148" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">trigger · terminate · recover</text>
<line x1="600" y1="180" x2="600" y2="300" stroke="#A78BFA" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="960" y="170" width="200" height="90" rx="14" fill="#C96A5A21" stroke="#C96A5A" stroke-width="2"/>
<text x="1060" y="204" font-family="Syne, sans-serif" font-weight="800" fill="#C96A5A" text-anchor="middle">Agents</text>
<text x="1060" y="228" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">tools · planning · memory</text>
<line x1="1060" y1="260" x2="600" y2="300" stroke="#C96A5A" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="960" y="300" width="200" height="90" rx="14" fill="#7FB06921" stroke="#7FB069" stroke-width="2"/>
<text x="1060" y="334" font-family="Syne, sans-serif" font-weight="800" fill="#7FB069" text-anchor="middle">Production</text>
<text x="1060" y="358" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">scale · eval · guardrails</text>
<line x1="960" y1="345" x2="700" y2="345" stroke="#7FB069" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="600" y="478" font-family="Syne, sans-serif" font-weight="600" fill="#94A3B8" text-anchor="middle">Each outer layer governs one question: what to fetch, what to show, when to call again, what to delegate, how to ship safely.</text>
</svg>