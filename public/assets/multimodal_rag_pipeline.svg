<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="Syne, sans-serif">
<defs><linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#0e1a2e"/></linearGradient></defs>
<rect width="1200" height="280" fill="url(#pbg)" rx="12"/>
<text x="600" y="36" fill="#F0A89A" font-weight="800" text-anchor="middle" font-size="20">Multimodal RAG Pipeline  Parse ù Summarize ù Store ù Query</text>
<g font-size="12" font-weight="700">
<rect x="40" y="70" width="250" height="90" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
<text x="165" y="100" fill="#5EC4C8" text-anchor="middle">1 ù Parse</text>
<text x="165" y="122" fill="#94A3B8" text-anchor="middle" font-weight="500">Text chunks + image files</text>
<text x="165" y="142" fill="#CBD5E1" text-anchor="middle" font-weight="500">tables structured</text>
<path d="M290 115 H320" stroke="#5EC4C8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="320" y="70" width="250" height="90" rx="10" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/>
<text x="445" y="100" fill="#5EC4C8" text-anchor="middle">2 ù Summarize</text>
<text x="445" y="122" fill="#94A3B8" text-anchor="middle" font-weight="500">Searchable image captions</text>
<text x="445" y="142" fill="#CBD5E1" text-anchor="middle" font-weight="500">index-time vision calls</text>
<path d="M570 115 H600" stroke="#5EC4C8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="600" y="70" width="250" height="90" rx="10" fill="#0f172a" stroke="#F0A89A" stroke-width="2"/>
<text x="725" y="100" fill="#F0A89A" text-anchor="middle">3 ù Store</text>
<text x="725" y="122" fill="#94A3B8" text-anchor="middle" font-weight="500">Vector + docstore IDs</text>
<text x="725" y="142" fill="#CBD5E1" text-anchor="middle" font-weight="500">multi-vector retriever</text>
<path d="M850 115 H880" stroke="#F0A89A" stroke-width="2" marker-end="url(#arr)"/>
<rect x="880" y="70" width="280" height="90" rx="10" fill="#0f172a" stroke="#C9B8E8" stroke-width="2"/>
<text x="1020" y="100" fill="#C9B8E8" text-anchor="middle">4 ù Query</text>
<text x="1020" y="122" fill="#94A3B8" text-anchor="middle" font-weight="500">Raw text + images ù answer</text>
<text x="1020" y="142" fill="#CBD5E1" text-anchor="middle" font-weight="500">grounded multimodal prompt</text>
</g>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5EC4C8"/></marker></defs>
<text x="600" y="210" fill="#94A3B8" text-anchor="middle" font-size="12">Embed summaries for search ù retrieve originals for reasoning</text>
<text x="600" y="240" fill="#CBD5E1" text-anchor="middle" font-size="11">Extends modality router with document-native parse + dual-store retrieval</text>
</svg>
