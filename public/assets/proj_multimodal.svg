<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
  <linearGradient id="mmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#241a10"/></linearGradient>
  <linearGradient id="mmgold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F0C674"/><stop offset="100%" stop-color="#d9a44c"/></linearGradient>
  <marker id="mmarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#F0C674"/></marker>
</defs>
<rect width="1200" height="460" fill="url(#mmbg)" rx="12"/>
<text x="40" y="46" fill="#fff" font-size="24" font-weight="800">Two entry points that replace typing</text>
<text x="40" y="70" fill="#94a3b8" font-size="13">Speech and images both become tokens for the same LLM. Everything after that is the text stack again.</text>

<rect x="40" y="94" width="540" height="230" rx="12" fill="#0b1220" stroke="#1e293b"/>
<text x="60" y="122" fill="#F0C674" font-size="13" font-weight="800">VOICE LOOP · STRICTLY SEQUENTIAL</text>

<g font-size="11" font-weight="700">
  <rect x="62" y="146" width="104" height="64" rx="8" fill="#0f172a" stroke="#F0C674" stroke-width="1.5"/>
  <text x="114" y="170" fill="#e2e8f0" text-anchor="middle">Microphone</text>
  <text x="114" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">5 s timeout</text>

  <rect x="198" y="146" width="104" height="64" rx="8" fill="#0f172a" stroke="#F0C674" stroke-width="1.5"/>
  <text x="250" y="170" fill="#e2e8f0" text-anchor="middle">STT</text>
  <text x="250" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">remote API</text>

  <rect x="334" y="146" width="104" height="64" rx="8" fill="url(#mmgold)"/>
  <text x="386" y="170" fill="#2a1d08" text-anchor="middle">Llama 3</text>
  <text x="386" y="188" fill="#3d2c10" font-size="10" font-weight="400" text-anchor="middle">local</text>

  <rect x="470" y="146" width="88" height="64" rx="8" fill="#0f172a" stroke="#F0C674" stroke-width="1.5"/>
  <text x="514" y="170" fill="#e2e8f0" text-anchor="middle">TTS</text>
  <text x="514" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">speaker</text>
</g>
<path d="M166,178 L194,178" stroke="#F0C674" stroke-width="1.5" marker-end="url(#mmarr)"/>
<path d="M302,178 L330,178" stroke="#F0C674" stroke-width="1.5" marker-end="url(#mmarr)"/>
<path d="M438,178 L466,178" stroke="#F0C674" stroke-width="1.5" marker-end="url(#mmarr)"/>
<path d="M514,214 L514,238 L114,238 L114,214" stroke="#F0C674" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#mmarr)"/>
<text x="60" y="268" fill="#94a3b8" font-size="11" font-weight="400">Sum of the four stages is the round trip. Nothing overlaps.</text>
<text x="60" y="288" fill="#E8837A" font-size="11" font-weight="700">Not interruptible: mic is closed while speaking.</text>
<text x="60" y="308" fill="#94a3b8" font-size="11" font-weight="400">Faster than 800 ms feels conversational; past 2 s it feels broken.</text>

<rect x="620" y="94" width="540" height="230" rx="12" fill="#0b1220" stroke="#1e293b"/>
<text x="640" y="122" fill="#5EC4C8" font-size="13" font-weight="800">VISION LOOP · ONE CALL PER IMAGE</text>

<g font-size="11" font-weight="700">
  <rect x="642" y="146" width="120" height="64" rx="8" fill="#0f172a" stroke="#5EC4C8" stroke-width="1.5"/>
  <text x="702" y="170" fill="#e2e8f0" text-anchor="middle">Image file</text>
  <text x="702" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">jpg · png · webp</text>

  <rect x="800" y="146" width="120" height="64" rx="8" fill="#0f172a" stroke="#5EC4C8" stroke-width="1.5"/>
  <text x="860" y="170" fill="#e2e8f0" text-anchor="middle">14 px patches</text>
  <text x="860" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">336² → 576</text>

  <rect x="958" y="146" width="120" height="64" rx="8" fill="#0f172a" stroke="#5EC4C8" stroke-width="1.5"/>
  <text x="1018" y="170" fill="#e2e8f0" text-anchor="middle">LLaVA</text>
  <text x="1018" y="188" fill="#94a3b8" font-size="10" font-weight="400" text-anchor="middle">vision + text</text>
</g>
<path d="M762,178 L796,178" stroke="#5EC4C8" stroke-width="1.5" marker-end="url(#mmarr)"/>
<path d="M920,178 L954,178" stroke="#5EC4C8" stroke-width="1.5" marker-end="url(#mmarr)"/>
<text x="640" y="248" fill="#94a3b8" font-size="11" font-weight="400">Template map picks the question: describe · objects · text · sentiment · technical.</text>
<text x="640" y="268" fill="#94a3b8" font-size="11" font-weight="400">A 200-image folder is 200 inferences — cost scales with files, not with time.</text>
<text x="640" y="288" fill="#E8837A" font-size="11" font-weight="700">Weak at counting, fine print and precise chart values.</text>
<text x="640" y="308" fill="#94a3b8" font-size="11" font-weight="400">Keep one image per call; batching raises peak memory, not throughput.</text>

<rect x="40" y="348" width="1120" height="80" rx="10" fill="#0f172a" stroke="#F0C674" stroke-width="1.5"/>
<text x="60" y="374" fill="#F0C674" font-size="12" font-weight="700">Multimodal does not remove the text stack — it feeds it.</text>
<text x="60" y="396" fill="#94a3b8" font-size="11" font-weight="400">Prompt design, chunking, retrieval and citation all still apply once the input has become text or visual tokens.</text>
<text x="60" y="416" fill="#94a3b8" font-size="11" font-weight="400">Budget for the extra tokens: one image is roughly 150 words of context before your question.</text>
</svg>
