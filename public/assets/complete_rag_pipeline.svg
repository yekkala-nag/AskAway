<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
<linearGradient id="cpbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101a30"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
</defs>
<style>
.flowline { stroke-dasharray: 8 8; animation: flowmv 1.4s linear infinite; }
@keyframes flowmv { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { .flowline { animation: none; } }
</style>
<rect width="1200" height="780" fill="url(#cpbg)" rx="12"/>
<rect x="630" y="18" width="250" height="42" rx="6" fill="#0f172a"/>
<text x="40" y="50" fill="#F1F5F9" font-size="34" font-weight="900">THE COMPLETE <tspan x="640" y="50">RAG PIPELINE</tspan></text>
<g font-size="12" font-weight="800" text-anchor="middle">
<rect x="40" y="92" width="140" height="32" rx="6" fill="#0f172a"/><text x="110" y="113" fill="#F1F5F9">STAGE 1</text>
<rect x="40" y="252" width="140" height="32" rx="6" fill="#0f172a"/><text x="110" y="273" fill="#F1F5F9">STAGE 2</text>
<rect x="40" y="412" width="140" height="32" rx="6" fill="#0f172a"/><text x="110" y="433" fill="#F1F5F9">STAGE 3</text>
<rect x="40" y="572" width="140" height="32" rx="6" fill="#0f172a"/><text x="110" y="593" fill="#F1F5F9">STAGE 4</text>
<rect x="40" y="128" width="140" height="56" rx="6" fill="#0f172a" stroke="#5EC4C8" stroke-width="2"/><text x="110" y="152" fill="#F1F5F9">INGESTION</text>
<rect x="40" y="288" width="140" height="56" rx="6" fill="#0f172a" stroke="#A78BFA" stroke-width="2"/><text x="110" y="312" fill="#F1F5F9">INDEXING</text>
<rect x="40" y="448" width="140" height="56" rx="6" fill="#0f172a" stroke="#E8C558" stroke-width="2"/><text x="110" y="472" fill="#F1F5F9">RETRIEVAL</text>
<rect x="40" y="608" width="140" height="56" rx="6" fill="#0f172a" stroke="#C96A5A" stroke-width="2"/><text x="110" y="626" fill="#F1F5F9" font-size="10">GENERATION</text><text x="110" y="642" fill="#F1F5F9" font-size="10">&amp; CHECK</text>
</g>
<g class="flowline" stroke-width="3" fill="none">
<line x1="110" y1="184" x2="110" y2="248" stroke="#5EC4C8"/>
<line x1="110" y1="344" x2="110" y2="408" stroke="#a78bfa"/>
<line x1="110" y1="504" x2="110" y2="568" stroke="#E8C558"/>
<line x1="420" y1="150" x2="660" y2="150" stroke="#5EC4C8"/>
<line x1="420" y1="310" x2="660" y2="310" stroke="#a78bfa"/>
<line x1="420" y1="470" x2="660" y2="470" stroke="#E8C558"/>
<line x1="420" y1="630" x2="660" y2="630" stroke="#C96A5A"/>
</g>
<g font-size="11">
<g><rect x="200" y="92" width="220" height="112" rx="8" fill="#0f172a" stroke="#5EC4C8"/><text x="214" y="116" fill="#F1F5F9" font-size="14" font-weight="800">Source Collection</text><text x="214" y="134" fill="#F1F5F9">• Pull PDFs, APIs, sites</text><text x="214" y="150" fill="#F1F5F9">• Transcripts + raw text</text><text x="214" y="166" fill="#F1F5F9">• All downstream depends</text><text x="214" y="186" fill="#ef4444">✕ gap = silent miss</text></g>
<g><rect x="440" y="92" width="220" height="112" rx="8" fill="#0f172a" stroke="#5EC4C8"/><text x="454" y="116" fill="#F1F5F9" font-size="14" font-weight="800">Document Loading</text><text x="454" y="134" fill="#F1F5F9">• Normalize formats</text><text x="454" y="150" fill="#F1F5F9">• Prep files for chunking</text><text x="454" y="166" fill="#ef4444">✕ formats break parsing</text></g>
<g><rect x="680" y="92" width="220" height="112" rx="8" fill="#0f172a" stroke="#5EC4C8"/><text x="694" y="116" fill="#F1F5F9" font-size="14" font-weight="800">Semantic Chunking</text><text x="694" y="134" fill="#F1F5F9">• Meaning, not length</text><text x="694" y="150" fill="#F1F5F9">• Keep boundaries</text><text x="694" y="166" fill="#ef4444">✕ fail → noisy retrieval</text></g>
<g><rect x="920" y="92" width="240" height="112" rx="8" fill="#0f172a" stroke="#475569"/><text x="934" y="116" fill="#F1F5F9" font-size="13" font-weight="800">Try it live ↓</text><text x="934" y="134" fill="#F1F5F9">toggle any step off,</text><text x="934" y="150" fill="#F1F5F9">watch scores move.</text><text x="934" y="170" fill="#5EC4C8" font-weight="700">12 steps · animated</text></g>
<g><rect x="200" y="252" width="220" height="112" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="214" y="276" fill="#F1F5F9" font-size="14" font-weight="800">Vector Store</text><text x="214" y="294" fill="#F1F5F9">• Fast lookup at scale</text><text x="214" y="310" fill="#F1F5F9">• Searchable KB out</text></g>
<g><rect x="440" y="252" width="220" height="112" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="454" y="276" fill="#F1F5F9" font-size="14" font-weight="800">Vector Embeddings</text><text x="454" y="294" fill="#F1F5F9">• Meaning → vectors</text><text x="454" y="310" fill="#ef4444">✕ off = full halt</text></g>
<g><rect x="680" y="252" width="220" height="112" rx="8" fill="#0f172a" stroke="#a78bfa"/><text x="694" y="276" fill="#F1F5F9" font-size="14" font-weight="800">Metadata Tagging</text><text x="694" y="294" fill="#F1F5F9">• Author·title·tags</text><text x="694" y="310" fill="#ef4444">✕ skip → precision dives</text></g>
<g><rect x="920" y="252" width="240" height="112" rx="8" fill="#0f172a" stroke="#475569"/><text x="934" y="276" fill="#F1F5F9" font-size="13" font-weight="800">Live runner →</text><text x="934" y="294" fill="#F1F5F9">stages light up in order,</text><text x="934" y="310" fill="#F1F5F9">metrics count up.</text><text x="934" y="330" fill="#E08A4C" font-weight="700">honest, deterministic</text></g>
<g><rect x="200" y="412" width="220" height="112" rx="8" fill="#0f172a" stroke="#E8C558"/><text x="214" y="436" fill="#F1F5F9" font-size="14" font-weight="800">Query Rewriting</text><text x="214" y="454" fill="#F1F5F9">• Clarify vague queries</text><text x="214" y="470" fill="#F1F5F9">• Sharper in → sharper out</text><text x="214" y="490" fill="#ef4444">✕ recall −30%</text></g>
<g><rect x="440" y="412" width="220" height="112" rx="8" fill="#0f172a" stroke="#E8C558"/><text x="454" y="436" fill="#F1F5F9" font-size="14" font-weight="800">Hybrid Search</text><text x="454" y="454" fill="#F1F5F9">• Vector + keyword</text><text x="454" y="470" fill="#F1F5F9">• Covers vector gaps</text></g>
<g><rect x="680" y="412" width="220" height="112" rx="8" fill="#0f172a" stroke="#E8C558"/><text x="694" y="436" fill="#F1F5F9" font-size="14" font-weight="800">Reranking</text><text x="694" y="454" fill="#F1F5F9">• True relevance model</text><text x="694" y="470" fill="#ef4444">✕ distractor leads top-k</text></g>
<g><rect x="920" y="412" width="240" height="112" rx="8" fill="#0f172a" stroke="#E8C558"/><text x="934" y="436" fill="#F1F5F9" font-size="13" font-weight="800">k slider + 3 queries</text><text x="934" y="454" fill="#F1F5F9">refund · deductible</text><text x="934" y="470" fill="#F1F5F9">escalation — try all</text></g>
<g><rect x="200" y="572" width="220" height="128" rx="8" fill="#0f172a" stroke="#C96A5A"/><text x="214" y="596" fill="#F1F5F9" font-size="14" font-weight="800">Evaluation</text><text x="214" y="614" fill="#F1F5F9">• Faithfulness·latency·cost</text><text x="214" y="630" fill="#F1F5F9">• Citations vs sources</text><text x="214" y="646" fill="#ef4444">✕ skip → drift invisible</text><text x="214" y="662" fill="#94A3B8">runs FIRST in display,</text><text x="214" y="676" fill="#94A3B8">LAST in pipeline</text></g>
<g><rect x="440" y="572" width="220" height="128" rx="8" fill="#0f172a" stroke="#C96A5A"/><text x="454" y="596" fill="#F1F5F9" font-size="14" font-weight="800">Answer Generation</text><text x="454" y="614" fill="#F1F5F9">• Grounded in retrieval</text><text x="454" y="630" fill="#ef4444">✕ no retrieval = invent</text><text x="454" y="646" fill="#94A3B8">the only LLM call</text><text x="454" y="662" fill="#94A3B8">that faces the user</text></g>
<g><rect x="680" y="572" width="220" height="128" rx="8" fill="#0f172a" stroke="#C96A5A"/><text x="694" y="596" fill="#F1F5F9" font-size="14" font-weight="800">Context Assembly</text><text x="694" y="614" fill="#F1F5F9">• Order + compress</text><text x="694" y="630" fill="#F1F5F9">• Fit signal in prompt</text><text x="694" y="646" fill="#ef4444">✕ raw stuff truncates best</text></g>
<g><rect x="920" y="572" width="240" height="128" rx="8" fill="#0f172a"/><text x="934" y="596" fill="#fff" font-size="13" font-weight="800">The thesis, small:</text><text x="934" y="616" fill="#C96A5A" font-size="12">order decides quality —</text><text x="934" y="634" fill="#C96A5A" font-size="12">ingest → index →</text><text x="934" y="652" fill="#C96A5A" font-size="12">retrieve → check.</text><text x="934" y="674" fill="#94A3B8" font-size="11">Skip check → ship drift.</text></g>
</g>
</svg>
