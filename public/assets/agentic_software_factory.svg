<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="Syne, sans-serif">
<defs><linearGradient id="asfbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d16"/><stop offset="1" stop-color="#101a30"/></linearGradient></defs>
<rect width="1100" height="420" fill="url(#asfbg)"/>
<text x="550" y="42" font-weight="800" fill="#F0A89A" text-anchor="middle" font-size="22">Agentic Software Factory - Hierarchy of Needs</text>
<text x="550" y="68" font-weight="600" fill="#CBD5E1" text-anchor="middle" font-size="13">Autonomous + asynchronous execution; specification and verification at every layer</text>
<polygon points="550,95 920,340 180,340" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="320" y="300" width="460" height="44" rx="8" fill="#3A9B9F22" stroke="#3A9B9F" stroke-width="2"/>
<text x="550" y="328" fill="#5EC4C8" text-anchor="middle" font-weight="800" font-size="14">1 - Harness - tools, run, feedback</text>
<rect x="380" y="248" width="340" height="44" rx="8" fill="#5EC4C822" stroke="#5EC4C8" stroke-width="2"/>
<text x="550" y="276" fill="#5EC4C8" text-anchor="middle" font-weight="800" font-size="14">2 - Personalization - rules, skills, ACLs</text>
<rect x="430" y="196" width="240" height="44" rx="8" fill="#F0A89A22" stroke="#F0A89A" stroke-width="2"/>
<text x="550" y="224" fill="#F0A89A" text-anchor="middle" font-weight="800" font-size="14">3 - Automation - triggers and queues</text>
<rect x="470" y="144" width="160" height="44" rx="8" fill="#C9B8E822" stroke="#C9B8E8" stroke-width="2"/>
<text x="550" y="172" fill="#C9B8E8" text-anchor="middle" font-weight="800" font-size="13">4 - Learning</text>
<text x="80" y="200" fill="#CBD5E1" font-size="12" font-weight="600">Higher layers need lower layers stable</text>
<text x="80" y="222" fill="#CBD5E1" font-size="11">Start: one agent + schedule + brief checks</text>
<rect x="720" y="120" width="340" height="100" rx="10" fill="#0f172a" stroke="#475569"/>
<text x="740" y="148" fill="#fff" font-weight="800" font-size="12">Return contract</text>
<text x="740" y="172" fill="#CBD5E1" font-size="11">Result + check evidence, or named blocker</text>
<text x="740" y="194" fill="#CBD5E1" font-size="11">Product decisions escalate to you</text>
<text x="550" y="400" fill="#CBD5E1" text-anchor="middle" font-size="11">Build tools agents use; operating informs what to build next</text>
</svg>
